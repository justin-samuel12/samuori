apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "samuori.fullname" . }}
  labels: {{- include "samuori.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "samuori.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "samuori.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "samuori.fullname" . }}
      automountServiceAccountToken: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: prepare-secrets
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - prepare-secrets
            - /secrets/cluster
            {{- if .Values.messaging.credentialsSecret.name }}
            - /secrets/nats
            {{- end }}
            {{- if .Values.storage.oci.credentialsSecret.name }}
            - /secrets/oci
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - /secrets/metrics
            {{- end }}
            {{- if .Values.messaging.clientCertSecret }}
            - /secrets/nats-client
            {{- end }}
            - /run/samuori/secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: run, mountPath: /run/samuori }
            - { name: cluster-key, mountPath: /secrets/cluster, readOnly: true }
            {{- if .Values.messaging.credentialsSecret.name }}
            - { name: nats-creds, mountPath: /secrets/nats, readOnly: true }
            {{- end }}
            {{- if .Values.storage.oci.credentialsSecret.name }}
            - { name: oci-creds, mountPath: /secrets/oci, readOnly: true }
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - { name: metrics-token, mountPath: /secrets/metrics, readOnly: true }
            {{- end }}
            {{- if .Values.messaging.clientCertSecret }}
            - { name: nats-client, mountPath: /secrets/nats-client, readOnly: true }
            {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/samuori/server.yml"]
          env:
            # The image's all-in-one defaults are cleared, so the mounted configuration is the only source.
            - { name: SAMUORI_ROLE, value: "" }
            - { name: SAMUORI_LISTEN, value: "" }
            - { name: SAMUORI_WORKER_LISTEN, value: "" }
            - { name: SAMUORI_DATA_DIR, value: "" }
            - { name: SAMUORI_UI_DIR, value: "" }
            - { name: SAMUORI_LOG_FORMAT, value: "" }
            - name: SAMUORI_DATABASE
              valueFrom: { secretKeyRef: { name: {{ .Values.database.dsnSecret.name | quote }}, key: {{ .Values.database.dsnSecret.key | quote }} } }
            {{- if .Values.database.migrationDsnSecret.name }}
            - name: SAMUORI_DATABASE_MIGRATION
              valueFrom: { secretKeyRef: { name: {{ .Values.database.migrationDsnSecret.name | quote }}, key: {{ .Values.database.migrationDsnSecret.key | quote }} } }
            {{- end }}
          ports:
            - { name: api, containerPort: 8443 }
            - { name: workers, containerPort: 8444 }
            {{- if .Values.metrics.enabled }}
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/v1/system/health, port: api, scheme: HTTPS }
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/samuori/server.yml, subPath: server.yml, readOnly: true }
            - { name: tls, mountPath: /etc/samuori/tls, readOnly: true }
            - { name: run, mountPath: /run/samuori, readOnly: true }
            - { name: data, mountPath: /var/lib/samuori }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.messaging.caSecret.name }}
            - { name: nats-ca, mountPath: /etc/samuori/nats-ca, readOnly: true }
            {{- end }}
            {{- if .Values.messaging.clientCertSecret }}
            - { name: nats-client, mountPath: /etc/samuori/nats-client, readOnly: true }
            {{- end }}
            {{- if .Values.backup.enabled }}
            - { name: backup-recipients, mountPath: /etc/samuori/backup, readOnly: true }
            - { name: backups, mountPath: /var/backups/samuori }
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - { name: config, configMap: { name: {{ include "samuori.fullname" . }} } }
        - { name: tls, secret: { secretName: {{ .Values.tls.secretName | quote }} } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 8Mi } }
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: cluster-key, secret: { secretName: {{ .Values.clusterKeySecret.name | quote }} } }
        {{- if .Values.messaging.credentialsSecret.name }}
        - { name: nats-creds, secret: { secretName: {{ .Values.messaging.credentialsSecret.name | quote }} } }
        {{- end }}
        {{- if .Values.messaging.caSecret.name }}
        - { name: nats-ca, secret: { secretName: {{ .Values.messaging.caSecret.name | quote }} } }
        {{- end }}
        {{- if .Values.messaging.clientCertSecret }}
        - { name: nats-client, secret: { secretName: {{ .Values.messaging.clientCertSecret | quote }} } }
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.storage.oci.credentialsSecret.name }}
        - { name: oci-creds, secret: { secretName: {{ .Values.storage.oci.credentialsSecret.name | quote }} } }
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - { name: metrics-token, secret: { secretName: {{ .Values.metrics.tokenSecret.name | quote }} } }
        {{- end }}
        {{- if .Values.backup.enabled }}
        - { name: backup-recipients, secret: { secretName: {{ .Values.backup.recipientsSecret.name | quote }} } }
        - name: backups
          {{- if .Values.backup.persistentVolumeClaim }}
          persistentVolumeClaim: { claimName: {{ .Values.backup.persistentVolumeClaim | quote }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "samuori.selector" . | nindent 20 }}
        {{- end }}
