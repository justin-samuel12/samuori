# Clean Ubuntu amd64 VM, emulated on Apple silicon, for all-in-one acceptance on amd64: install.sh does everything.
vmType: qemu
arch: x86_64
cpus: 4
memory: 6GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
    arch: x86_64
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 8080
    hostIP: 127.0.0.1
    hostPort: 18483
  - guestPortRange: [1, 65535]
    ignore: true
