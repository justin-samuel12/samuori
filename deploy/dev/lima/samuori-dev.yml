# Linux development VM for tests that need namespaces, seccomp or BuildKit. No host mounts: copy sources in.
vmType: vz
cpus: 4
memory: 6GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make git curl ca-certificates gcc libc6-dev >/dev/null
