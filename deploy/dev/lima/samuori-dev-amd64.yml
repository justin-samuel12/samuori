# Emulated amd64 development VM on Apple silicon for the unit, integration and BuildKit suites on amd64.
# Emulation is not native amd64 hardware validation. No host mounts: copy sources in.
vmType: qemu
arch: x86_64
cpus: 6
memory: 12GiB
disk: 60GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
    arch: x86_64
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPortRange: [1, 65535]
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make git curl ca-certificates gcc libc6-dev >/dev/null
