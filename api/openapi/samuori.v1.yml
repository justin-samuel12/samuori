    get:
      tags: [tenancy]
      operationId: getProject
      x-samuori-roles: [developer, maintainer, publisher, security-reviewer, administrator]
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [tenancy]
      operationId: updateProject
      description: Changes project settings. Automatic publication also needs the spec to ask for it.
      x-samuori-roles: [maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/archive:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [tenancy]
      operationId: archiveProject
      description: "Hides the project and refuses new work for it with 409. Revokes its secret grants and bindings, egress allowances, destination access, federation grants and pipelines, expires its pending requests and cancels its unfinished builds; each is audited. Restoring does not bring grants back (ADR 0058)."
      x-samuori-roles: [maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectArchiveRequest" }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectArchive" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/restore:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [tenancy]
      operationId: restoreProject
      description: "Makes an archived project usable again, with no grants. A purged project cannot be restored (ADR 0058)."
      x-samuori-roles: [maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/purge:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [tenancy]
      operationId: purgeProject
      description: "Deletes what an archived project stored in internal storage and keeps its records and audit trail. X-Samuori-Confirm must be the project's name; without it the answer is 428. Images already pushed to external registries are not deleted. Safe to run again after a partial failure (ADR 0058)."
      x-samuori-roles: [administrator]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Samuori-Confirm, in: header, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPurge" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/images:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [artifacts]
      operationId: listProjectImages
      description: The Image Library — images the project's builds produced, newest first, with validation and publications.
      x-samuori-roles: [developer, maintainer, publisher, security-reviewer, administrator]
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSummaryList" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/build-methods:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [specs]
      operationId: getProjectBuildMethods
      description: The build methods this project may use now and the organization's default, for the wizard. Shows availability and reasons only, never provider pins or scope (ADR 0047).
      x-samuori-roles: [developer, maintainer, publisher, security-reviewer, administrator]
      responses:
        "200":
          description: Build methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildMethodOptions" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/uploads:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [sources]
      operationId: createUploadSession
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionCreate" }
      responses:
        "201":
          description: Upload session with limits; files are sent as chunks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /upload-policy:
    get:
      tags: [sources]
      operationId: getUploadPolicy
      x-samuori-roles: [developer, maintainer]
      responses:
        "200":
          description: Limits and default exclusions applied to every upload, for previewing before transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPolicy" }

  /uploads/{uploadId}:
    parameters: [{ $ref: "#/components/parameters/UploadId" }]
    get:
      tags: [sources]
      operationId: getUploadSession
      x-samuori-roles: [developer, maintainer]
      responses:
        "200":
          description: Upload progress, including which chunks have been received (for resuming)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "404": { $ref: "#/components/responses/Problem" }

  /uploads/{uploadId}/chunks/{index}:
    parameters:
      - { $ref: "#/components/parameters/UploadId" }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      tags: [sources]
      operationId: putUploadChunk
      x-samuori-roles: [developer, maintainer]
      x-samuori-max-body-bytes: 8388608
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Chunk stored }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /uploads/{uploadId}/commit:
    parameters: [{ $ref: "#/components/parameters/UploadId" }]
    post:
      tags: [sources]
      operationId: commitUpload
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202":
          description: Validation and snapshot creation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/snapshots:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [sources]
      operationId: listSnapshots
      x-samuori-roles: [developer, maintainer, security-reviewer, administrator]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Immutable snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceSnapshotList" }

  /snapshots/{snapshotId}:
    parameters: [{ $ref: "#/components/parameters/SnapshotId" }]
    get:
      tags: [sources]
      operationId: getSnapshot
      x-samuori-roles: [developer, maintainer, security-reviewer, administrator]
      responses:
        "200":
          description: Snapshot metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceSnapshot" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [sources]
      operationId: deleteSnapshot
      description: The person who uploaded it deletes an upload. Its record stays, marked deleted, so builds keep their history; its files are removed from storage unless another upload or artifact uses them. Refused while a build is running from it.
      x-samuori-roles: [developer, maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted and audited }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /snapshots/{snapshotId}/discoveries:
    parameters: [{ $ref: "#/components/parameters/SnapshotId" }]
    post:
      tags: [discovery]
      operationId: startDiscovery
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "202":
          description: Static, non-executing discovery started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/Problem" }

    get:
      tags: [discovery]
      operationId: listSnapshotDiscoveries
      x-samuori-roles: [developer, maintainer]
      responses:
        "200":
          description: Discoveries of this snapshot, newest first, without findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryList" }
        "404": { $ref: "#/components/responses/Problem" }

  /discoveries/{discoveryId}:
    parameters: [{ name: discoveryId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [discovery]
      operationId: getDiscovery
      x-samuori-roles: [developer, maintainer]
      responses:
        "200":
          description: Findings, evidence and Dockerfile analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/specs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [specs]
      operationId: listSpecs
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: name, in: query, description: "Only the spec with this exact metadata.name", schema: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Specs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildSpecList" }
    post:
      tags: [specs]
      operationId: createSpec
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecRevisionCreate" }
      responses:
        "201":
          description: Spec created with revision 1
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecRevision" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "A spec with this metadata.name exists in the project (code spec_exists); add a revision to it instead"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /spec-documents/validate:
    post:
      tags: [specs]
      operationId: validateSpecDocument
      description: Parses, validates and canonicalizes a BuildSpec without saving it. Editors use it to switch views.
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecDocumentInput" }
      responses:
        "200":
          description: Validation result; canonical forms are present when the document parses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecValidation" }

  /projects/{projectId}/wizard-draft:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [specs]
      operationId: getWizardDraft
      x-samuori-roles: [developer, maintainer]
      responses:
        "200":
          description: The caller's in-progress wizard state for this project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WizardDraft" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [specs]
      operationId: saveWizardDraft
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WizardDraftWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WizardDraft" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [specs]
      operationId: deleteWizardDraft
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Discarded }

  /specs/{specId}:
    parameters: [{ $ref: "#/components/parameters/SpecId" }]
    get:
      tags: [specs]
      operationId: getSpec
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: Spec metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildSpec" }
        "404": { $ref: "#/components/responses/Problem" }

  /specs/{specId}/revisions:
    parameters: [{ $ref: "#/components/parameters/SpecId" }]
    get:
      tags: [specs]
      operationId: listSpecRevisions
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Immutable revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecRevisionList" }
    post:
      tags: [specs]
      operationId: createSpecRevision
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecRevisionCreate" }
      responses:
        "201":
          description: New immutable revision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecRevision" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /specs/{specId}/revisions/{revision}:
    parameters: [{ $ref: "#/components/parameters/SpecId" }, { $ref: "#/components/parameters/Revision" }]
    get:
      tags: [specs]
      operationId: getSpecRevision
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: Revision with its BuildSpec document
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecRevision" }
        "404": { $ref: "#/components/responses/Problem" }

  /specs/{specId}/revisions/{revision}/admission-checks:
    parameters: [{ $ref: "#/components/parameters/SpecId" }, { $ref: "#/components/parameters/Revision" }]
    post:
      tags: [specs]
      operationId: checkAdmission
      description: Dry run of admission (schema, semantic, policy, secret readiness, platform). Creates no build.
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionCheckRequest" }
      responses:
        "200":
          description: Admission report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionReport" }
        "404": { $ref: "#/components/responses/Problem" }

  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: "Recipe versions with this organization's status; developers see approved and deprecated versions and runtimes only"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeList" }

  /recipes/{recipeId}/versions/{version}/status:
    parameters:
      - { name: recipeId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,32}$" } }
    put:
      tags: [recipes]
      operationId: setRecipeStatus
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeStatusWrite" }
      responses:
        "204": { description: Status recorded }
        "404": { $ref: "#/components/responses/Problem" }

  /recipes/{recipeId}/versions/{version}/runtimes:
    parameters:
      - { name: recipeId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,32}$" } }
    get:
      tags: [recipes]
      operationId: listRecipeRuntimes
      description: A built-in recipe version's shipped runtimes and the runtimes administrators added (ADR 0051). Only administrators see drafts and withdrawn runtimes.
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: Shipped and organization runtimes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeRuntimes" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [recipes]
      operationId: createRecipeRuntime
      description: Adds a draft runtime to a built-in recipe version. Both images must be pinned by digest and allowed by the base-image policy.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationRuntimeWrite" }
      responses:
        "201":
          description: Draft saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationRuntime" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /recipes/{recipeId}/versions/{version}/runtimes/{runtimeId}/actions:
    parameters:
      - { name: recipeId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,32}$" } }
      - { name: runtimeId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z]{1,64}$" } }
    post:
      tags: [recipes]
      operationId: decideRecipeRuntime
      description: Approves a draft runtime, or withdraws a draft or approved one, with a reason. Withdrawn runtimes stay as history.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationRuntimeAction" }
      responses:
        "200":
          description: Decision recorded and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationRuntime" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /recipes/{recipeId}/versions/{version}/shipped-runtimes/{label}/status:
    parameters:
      - { name: recipeId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,32}$" } }
      - { name: label, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,16}$" } }
    put:
      tags: [recipes]
      operationId: setShippedRuntimeStatus
      description: "Deprecates, withdraws or approves again one runtime a built-in recipe version ships, for this organization, with a reason (ADR 0060). It applies from the next admission; builds already planned keep their plan."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippedRuntimeStatusWrite" }
      responses:
        "204": { description: Status recorded and audited }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /custom-recipes:
    get:
      tags: [recipes]
      operationId: listCustomRecipes
      description: Every version of the organization's custom recipes, drafts included (ADR 0041).
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Custom recipe versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRecipeList" }
    post:
      tags: [recipes]
      operationId: createCustomRecipe
      description: Saves a new draft version from its YAML or JSON definition.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRecipeWrite" }
      responses:
        "201":
          description: Draft saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRecipe" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /custom-recipes/preview:
    post:
      tags: [recipes]
      operationId: previewCustomRecipe
      description: Validates a definition and renders the Dockerfile Samuori would build, without saving anything.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRecipePreviewRequest" }
      responses:
        "200":
          description: The rendered Dockerfile, or the problems that stop it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRecipePreview" }

  /custom-recipes/{recipeId}/versions/{version}:
    parameters:
      - { name: recipeId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z.+-]{1,32}$" } }
    put:
      tags: [recipes]
      operationId: replaceCustomRecipeDraft
      description: Changes a draft; approved versions never change.
