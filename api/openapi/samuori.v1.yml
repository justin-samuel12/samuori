        reason: { type: string }
        requestId: { type: string }
    AuditEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    NotificationMessage:
      type: object
      required: [id, type, title, text, link, occurredAt]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        text: { type: string }
        link: { type: string }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        project:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
    Notification:
      type: object
      required: [id, message, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        message: { $ref: "#/components/schemas/NotificationMessage" }
        readAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        unread: { type: integer }
    NotificationChannelCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 63 }
        kind: { type: string, enum: [webhook, slack, teams, email] }
        url: { type: string, maxLength: 2048, description: Webhook endpoint }
        recipients: { type: array, maxItems: 50, items: { type: string, maxLength: 254 } }
        secret: { type: string, format: password, writeOnly: true, maxLength: 2048, description: Slack or Teams incoming webhook URL }
        allowPrivateNetwork: { type: boolean }
    NotificationChannelUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 63 }
        url: { type: string, maxLength: 2048, description: Webhook endpoint }
        recipients: { type: array, maxItems: 50, items: { type: string, maxLength: 254 } }
        secret: { type: string, format: password, writeOnly: true, maxLength: 2048, description: "Slack or Teams: a new incoming webhook URL; omit to keep the current one" }
        allowPrivateNetwork: { type: boolean }
    NotificationChannel:
      type: object
      required: [id, name, kind, enabled, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { type: string }
        url: { type: string }
        recipients: { type: array, items: { type: string } }
        allowPrivateNetwork: { type: boolean }
        enabled: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    NotificationChannelCreated:
      allOf:
        - { $ref: "#/components/schemas/NotificationChannel" }
        - type: object
          properties:
            signingKey: { type: string, x-samuori-reveal-once: true, description: "Webhook channels: the HMAC key for X-Samuori-Signature; shown once" }
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationChannel" } }
    NotificationRuleCreate:
      type: object
      additionalProperties: false
      required: [channelId, events]
      properties:
        channelId: { $ref: "#/components/schemas/Id" }
        events: { type: array, minItems: 1, items: { type: string, enum: [build.succeeded, build.failed, validation.passed, validation.failed, validation.blocked, publication.published, publication.failed, publication.blocked, approval.requested, approval.decided, exception.requested, worker.revoked, artifact.quarantined] } }
        teamId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
    NotificationRule:
      type: object
      required: [id, channelId, events]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        channelId: { $ref: "#/components/schemas/Id" }
        events: { type: array, items: { type: string } }
        teamId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
    NotificationRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationRule" } }
    NotificationDelivery:
      type: object
      required: [id, channelId, eventId, eventType, state, attempts, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        channelId: { $ref: "#/components/schemas/Id" }
        eventId: { type: string }
        eventType: { type: string }
        state: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        nextAttemptAt: { $ref: "#/components/schemas/Timestamp" }
        lastError: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        deliveredAt: { $ref: "#/components/schemas/Timestamp" }
    NotificationDeliveryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationDelivery" } }
    PipelineCreate:
      type: object
      additionalProperties: false
      required: [name, projectId, specId, repoUrl, refs, hookScheme]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        projectId: { $ref: "#/components/schemas/Id" }
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer, minimum: 0, description: "0 builds the spec's latest revision" }
        repoUrl: { type: string, maxLength: 500, description: "https only (http only on loopback); no credentials" }
        refs: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 220 }, description: "Ref globs such as refs/heads/main or refs/tags/v*" }
        username: { type: string, maxLength: 100 }
        token: { type: string, format: password, writeOnly: true, maxLength: 4096, description: "Read-only repository token, stored for the controller only" }
        allowPrivateNetwork: { type: boolean }
        hookScheme: { type: string, enum: [hmac-sha256, gitlab-token] }
        ownerId: { $ref: "#/components/schemas/Id" }
    Pipeline:
      type: object
      required: [id, name, projectId, specId, specRevision, repoUrl, refs, hasToken, allowPrivateNetwork, hookScheme, ownerId, enabled, hookPath, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        projectId: { $ref: "#/components/schemas/Id" }
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer }
        repoUrl: { type: string }
        refs: { type: array, items: { type: string } }
        username: { type: string }
        hasToken: { type: boolean }
        allowPrivateNetwork: { type: boolean }
        hookScheme: { type: string }
        ownerId: { $ref: "#/components/schemas/Id" }
        enabled: { type: boolean }
        hookPath: { type: string, description: "Webhook path under the API base, such as /api/v1/hooks/pipelines/{id}" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    PipelineCreated:
      allOf:
        - $ref: "#/components/schemas/Pipeline"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, x-samuori-reveal-once: true, description: "Webhook secret; shown once" }
    PipelineSecretIssued:
      type: object
      required: [secret]
      properties:
        secret: { type: string, x-samuori-reveal-once: true, description: "Webhook secret; shown once" }
    PipelineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Pipeline" } }
    PipelineRunCreate:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: { type: string, maxLength: 220, description: "Full ref such as refs/heads/main" }
    PipelineRun:
      type: object
      required: [id, pipelineId, trigger, ref, state, skippedEntries, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        pipelineId: { $ref: "#/components/schemas/Id" }
        trigger: { type: string, enum: [webhook, manual, api] }
        ref: { type: string }
        requestedCommit: { type: string }
        commit: { type: string }
        state: { type: string, enum: [queued, fetching, started, failed, skipped] }
        failureCode: { type: string }
        message: { type: string }
        skippedEntries: { type: integer, description: "Tree entries that cannot become snapshot files, such as submodules" }
        snapshotId: { $ref: "#/components/schemas/Id" }
        buildRunId: { $ref: "#/components/schemas/Id" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    PipelineRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PipelineRun" } }
    PipelineHookResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, skipped, duplicate, ignored] }
        runId: { $ref: "#/components/schemas/Id" }
        reason: { type: string }
    AuditPolicyUpdate:
      type: object
      additionalProperties: false
      required: [retentionDays, exportEnabled, requireExport]
      properties:
        retentionDays: { type: integer, minimum: 0, maximum: 36500, description: "0 keeps events forever; otherwise at least 30" }
        exportEnabled: { type: boolean, description: Write new events to JSON Lines files in the controller's audit export directory }
        requireExport: { type: boolean, description: Purge only events that scheduled export has already written }
    AuditPolicy:
      type: object
      required: [retentionDays, exportEnabled, requireExport, lastPurgeCount]
      properties:
        retentionDays: { type: integer }
        exportEnabled: { type: boolean }
        requireExport: { type: boolean }
        exportedThrough: { $ref: "#/components/schemas/Timestamp" }
        lastExportAt: { $ref: "#/components/schemas/Timestamp" }
        lastExportError: { type: string }
        lastPurgeAt: { $ref: "#/components/schemas/Timestamp" }
        lastPurgeCount: { type: integer }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    CountByKey:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    StateCounts:
      type: object
      required: [byState, last24h]
      properties:
        byState: { type: object, additionalProperties: { type: integer } }
        last24h: { type: object, additionalProperties: { type: integer }, description: Records that reached a terminal state in the last 24 hours }
    Diagnostics:
      type: object
      required: [at, health, builds, validations, publications, workers, registries, outbox, telemetry]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        health: { $ref: "#/components/schemas/Health" }
        builds:
          allOf:
            - { $ref: "#/components/schemas/StateCounts" }
            - type: object
              required: [queuedOldestSeconds, failureClasses24h]
              properties:
                queuedOldestSeconds: { type: number }
                failureClasses24h: { type: array, items: { $ref: "#/components/schemas/CountByKey" } }
        validations: { $ref: "#/components/schemas/StateCounts" }
        publications: { $ref: "#/components/schemas/StateCounts" }
        workers:
          type: object
          required: [byEnrollment, connected, stale, pools]
          properties:
            byEnrollment: { type: object, additionalProperties: { type: integer } }
            connected: { type: integer }
            stale: { type: integer, description: Enrolled workers without a heartbeat for more than two minutes }
            pools:
              type: array
              items:
                type: object
                required: [id, name, location, isolationProfile, profileApproved, enrolled, connected, stale]
                properties:
                  id: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  location: { type: string }
                  isolationProfile: { type: string }
                  profileApproved: { type: boolean }
                  enrolled: { type: integer }
                  connected: { type: integer }
                  stale: { type: integer }
        registries:
          type: array
          items:
            type: object
            required: [registry, profile, status]
            properties:
              registry: { type: string }
              profile: { type: string }
              status: { type: string, description: "ok, failed or untested" }
              testedAt: { $ref: "#/components/schemas/Timestamp" }
        outbox:
          type: object
          required: [pending, oldestSeconds]
          properties:
            pending: { type: integer }
            oldestSeconds: { type: number }
        telemetry:
          type: object
          required: [metricsEnabled, tracingEnabled, auditExportDirectory]
          properties:
            metricsEnabled: { type: boolean }
            tracingEnabled: { type: boolean }
            auditExportDirectory: { type: boolean, description: Whether a directory for scheduled audit exports is configured }

    Operation:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        resourceType: { type: string }
        resourceId: { $ref: "#/components/schemas/Id" }
        error: { $ref: "#/components/schemas/Problem" }
    KubeConversionInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [compose, source, build, publication] }
        snapshotId: { $ref: "#/components/schemas/Id" }
        composePath: { type: string, maxLength: 512, description: The Compose file's path inside the upload }
        sourceDir: { type: string, maxLength: 512 }
        buildRunId: { $ref: "#/components/schemas/Id" }
        publicationId: { $ref: "#/components/schemas/Id" }
        service: { type: string, maxLength: 63, description: "The Compose service whose image the Samuori image replaces, or the service name for an image-only input" }
    KubeConversionOptions:
      type: object
      additionalProperties: false
      properties:
        format: { type: string, enum: [manifests, helm, kustomize] }
        namespace: { type: string, maxLength: 63 }
        replicas: { type: integer, minimum: 0, maximum: 100 }
        exposure:
          type: object
          additionalProperties: false
          properties:
            service: { type: string, maxLength: 63 }
            type: { type: string, enum: [cluster-ip, node-port, load-balancer, ingress] }
            host: { type: string, maxLength: 253 }
            path: { type: string, maxLength: 200 }
        resources:
          type: object
          additionalProperties: false
          properties:
            cpuRequest: { type: string, maxLength: 32 }
            memoryRequest: { type: string, maxLength: 32 }
            cpuLimit: { type: string, maxLength: 32 }
            memoryLimit: { type: string, maxLength: 32 }
        storage:
          type: object
          additionalProperties: false
          properties:
            volumes: { type: string, enum: [persistentVolumeClaim, emptyDir], description: hostPath is never offered }
            size: { type: string, maxLength: 32 }
            storageClass: { type: string, maxLength: 63 }
        kubernetesVersion: { type: string, maxLength: 16 }
    KubeConversionCreate:
      type: object
      additionalProperties: false
      required: [name, provider, input]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        provider: { type: string, enum: [kompose, move2kube] }
        input: { $ref: "#/components/schemas/KubeConversionInput" }
        options: { $ref: "#/components/schemas/KubeConversionOptions" }
    KubeConversionRerun:
      type: object
      additionalProperties: false
      properties:
        options: { $ref: "#/components/schemas/KubeConversionOptions" }
        answers: { type: object, additionalProperties: { type: string, maxLength: 1024 }, maxProperties: 200 }
    KubeConversionQuestion:
      type: object
      required: [id, text, kind]
      description: A question the provider answered with a default. Lists (MultiSelect) are JSON arrays; Confirm is true or false.
      properties:
        id: { type: string }
        text: { type: string }
        kind: { type: string, description: "Select, MultiSelect, Confirm, Input or MultiLineInput" }
        hints: { type: array, items: { type: string } }
        options: { type: array, items: { type: string } }
        default: { type: string, description: The provider's default }
        answer: { type: string, description: "The value this run used: the user's answer or the default" }
    KubeProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, displayName, available, inputs, formats]
            properties:
              name: { type: string, enum: [kompose, move2kube] }
              displayName: { type: string }
              available: { type: boolean }
              reason: { type: string, description: Why the provider cannot be used now }
              maintenance: { type: string, description: "The provider's maintenance warning, if any" }
              asksQuestions: { type: boolean }
              inputs: { type: array, items: { type: string, enum: [compose, source, build, publication] } }
              formats: { type: array, items: { type: string, enum: [manifests, helm, kustomize] } }
    KubeConversionRun:
      type: object
      required: [id, number, state, providerVersion, options, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        number: { type: integer }
        state: { type: string, enum: [queued, assigned, running, needs-answers, succeeded, failed, timed-out, cancelled] }
        providerVersion: { type: string }
        options: { $ref: "#/components/schemas/KubeConversionOptions" }
        answers: { type: object, additionalProperties: { type: string } }
        failureClass: { type: string }
        detail: { type: string }
        questions: { type: array, items: { $ref: "#/components/schemas/KubeConversionQuestion" } }
        revision: { type: integer, description: The revision this run produced }
        toolDigest: { type: string, description: SHA-256 of the tool the worker verified and ran }
        operationId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        endedAt: { $ref: "#/components/schemas/Timestamp" }
    KubeConversionRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KubeConversionRun" } }
    KubeConversion:
      type: object
      required: [id, projectId, name, provider, input, options, state, currentRevision, createdBy, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        provider: { type: string }
        input: { $ref: "#/components/schemas/KubeConversionInput" }
        options: { $ref: "#/components/schemas/KubeConversionOptions" }
        state: { type: string, enum: [queued, assigned, running, needs-answers, succeeded, failed, timed-out, cancelled] }
        currentRevision: { type: integer, description: 0 until a run succeeds }
        latestRun: { $ref: "#/components/schemas/KubeConversionRun" }
        createdBy: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    KubeConversionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KubeConversion" } }
    KubeConversionFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, review, warning, info] }
        code: { type: string }
        message: { type: string }
        file: { type: string }
        object: { type: string }
        field: { type: string }
        source: { type: string, enum: [provider, options, policy, schema] }
    KubeConversionFindingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KubeConversionFinding" } }
    KubeConversionLineage:
      type: object
      description: Where a revision came from; never credentials.
      properties:
        projectId: { type: string }
        input: { $ref: "#/components/schemas/KubeConversionInput" }
        snapshotDigest: { type: string }
        specId: { type: string }
        specRevision: { type: integer }
        buildRunId: { type: string }
        imageDigest: { type: string }
        imageReference: { type: string }
        provider: { type: string }
        providerVersion: { type: string }
        toolDigest: { type: string }
        options: { $ref: "#/components/schemas/KubeConversionOptions" }
        kubernetesVersion: { type: string }
        runId: { type: string }
        workerId: { type: string }
        isolationProfile: { type: string }
        editedFrom: { type: integer }
    KubeConversionFileInfo:
      type: object
      required: [path, digest, size]
      properties:
        path: { type: string }
        digest: { type: string }
        size: { type: integer }
    KubeConversionFile:
      type: object
      required: [path, digest, size, content]
      properties:
        path: { type: string }
        digest: { type: string }
        size: { type: integer }
        content: { type: string }
    KubeConversionFileEdit:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, maxLength: 524288 }
    KubeConversionRevision:
      type: object
      required: [number, origin, errors, findings, lineage, files, createdBy, createdAt]
      properties:
        number: { type: integer }
        runId: { type: string }
        parent: { type: integer }
        origin: { type: string, enum: [provider, edit] }
        errors: { type: integer, description: Error findings (policy violations and invalid objects) }
        findings: { type: array, items: { $ref: "#/components/schemas/KubeConversionFinding" } }
        lineage: { $ref: "#/components/schemas/KubeConversionLineage" }
        files: { type: array, items: { $ref: "#/components/schemas/KubeConversionFileInfo" } }
        createdBy: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    KubeConversionRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, origin, errors, createdBy, createdAt]
            properties:
              number: { type: integer }
              runId: { type: string }
              parent: { type: integer }
              origin: { type: string, enum: [provider, edit] }
              errors: { type: integer }
              findings: { type: integer, description: Number of findings }
              createdBy: { type: string }
              createdAt: { $ref: "#/components/schemas/Timestamp" }
