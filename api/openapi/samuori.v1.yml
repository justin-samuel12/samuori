        destination: { type: string, description: "host:port" }
        network: { type: string, enum: [public, internal] }
        methods: { type: array, items: { type: string, enum: [dockerfile, recipe, railpack, buildpacks] } }
        reason: { type: string, description: The request's justification }
        requestId: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [active, revoked, expired] }
