        no client text is stored as evidence.
      properties:
        buildId: { $ref: "#/components/schemas/Id" }
        discoveryId: { $ref: "#/components/schemas/Id" }
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer, minimum: 1 }
        snapshotId: { $ref: "#/components/schemas/Id" }
        code: { type: string, maxLength: 64 }
        path: { type: string, maxLength: 4096 }
        line: { type: integer, minimum: 0 }
    EgressAccessRequestCreate:
      type: object
      additionalProperties: false
      required: [presets, destinations, justification, evidence]
      properties:
        method: { type: string, enum: [dockerfile, recipe, railpack, buildpacks], description: "The build method to open egress for; defaults to the evidence's own method, such as the build's" }
        presets: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
        destinations: { type: array, maxItems: 20, items: { type: string, maxLength: 260 }, description: "Public host:port destinations" }
        internalDestinations: { type: array, maxItems: 20, items: { type: string, maxLength: 260 }, description: "host:port destinations that may resolve to private addresses; loopback, link-local and metadata are refused" }
        justification: { type: string, minLength: 20, maxLength: 2048 }
        evidence: { $ref: "#/components/schemas/EgressEvidenceRef" }
    EgressEvidence:
      type: object
      required: [kind]
      description: Evidence the server took from stored data when the request was made
      properties:
        kind: { type: string, enum: [readiness, build] }
        buildId: { $ref: "#/components/schemas/Id" }
        discoveryId: { $ref: "#/components/schemas/Id" }
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer }
        snapshotId: { $ref: "#/components/schemas/Id" }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        line: { type: integer }
        denied: { type: array, items: { type: string }, description: "Destinations the build's egress proxy denied" }
    EgressAccessRequest:
      type: object
      required: [id, projectId, method, presets, destinations, justification, evidence, approvalId, state, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        method: { type: string, enum: [dockerfile, recipe, railpack, buildpacks] }
        presets: { type: array, items: { type: string } }
        destinations: { type: array, items: { type: string } }
        internalDestinations: { type: array, items: { type: string } }
        justification: { type: string }
        evidence: { $ref: "#/components/schemas/EgressEvidence" }
        approvalId: { $ref: "#/components/schemas/Id" }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        reason: { type: string, description: "The decider's reason" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    EgressAccessRequestList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EgressAccessRequest" } }
    EgressAllowance:
      type: object
      required: [id, projectId, kind, methods, reason, requestId, status, requestedBy, approvedBy, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [preset, destination] }
