    post:
      tags: [workers]
      operationId: createLocation
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationCreate" }
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /locations/{locationName}:
    parameters: [{ name: locationName, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" } }]
    delete:
      tags: [workers]
      operationId: deleteLocation
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/locations:
    parameters: [{ name: projectId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [workers]
      operationId: getProjectLocations
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Locations the project's builds may run in; empty means any
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocations" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [workers]
      operationId: setProjectLocations
      description: Restricts the project's builds to these locations (data residency); an empty list allows any.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectLocations" }
      responses:
        "200":
          description: The project's locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocations" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /pki:
    get:
      tags: [workers]
      operationId: getTrustBundle
      x-samuori-roles: [operator, administrator]
      responses:
        "200":
          description: The internal CAs, the bundle version and the workers that have not acknowledged it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustBundleStatus" }

  /pki/rotations:
    post:
      tags: [workers]
      operationId: startCaRotation
      description: A planned rotation adds a new CA to the trust bundle; an emergency rotation replaces every CA and revokes every worker identity (ADR 0026).
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaRotation" }
      responses:
        "200":
          description: The new trust bundle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustBundleStatus" }
        "409": { $ref: "#/components/responses/Problem" }

  /pki/rotations/switch:
    post:
      tags: [workers]
      operationId: switchCaRotation
      description: Makes the new CA issue certificates once every active worker has acknowledged the bundle.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: The new trust bundle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustBundleStatus" }
        "409": { $ref: "#/components/responses/Problem" }

  /signing-keys:
    get:
      tags: [publication]
      operationId: listSigningKeys
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: The organization's signing keys; public keys only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKeyList" }
    post:
      tags: [publication]
      operationId: createSigningKey
      description: "Makes a new active key; the previous active key is retired. Without providerId the controller generates the key and keeps it as a controller-only secret. With providerId and keyRef the key stays in OpenBao or Vault Transit (mount/key) or AWS KMS (key ID, ARN or alias); it must be ECDSA P-256 and pass a test signature."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
                providerId: { $ref: "#/components/schemas/Id" }
                keyRef: { type: string, maxLength: 2048 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "422": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /signing-keys/{keyId}/retire:
    parameters: [{ name: keyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [publication]
      operationId: retireSigningKey
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Retired; its public key stays available for verification }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/output-exceptions:
    parameters: [{ name: projectId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [validation]
      operationId: listOutputExceptions
      x-samuori-roles: [developer, maintainer, publisher, security-reviewer, administrator]
      responses:
        "200":
          description: The project's exceptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputExceptionList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [validation]
      operationId: requestOutputException
      description: Requests an exception for require-exception findings under the given paths (ADR 0031). An administrator other than the requester decides it; block findings are never excepted.
      x-samuori-roles: [maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutputExceptionRequest" }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputException" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /output-exceptions:
    get:
      tags: [validation]
      operationId: listPendingOutputExceptions
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Requests waiting for a decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputExceptionList" }

  /output-exceptions/{exceptionId}/decision:
    parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [validation]
      operationId: decideOutputException
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputException" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /output-exceptions/{exceptionId}/revoke:
    parameters: [{ name: exceptionId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [validation]
      operationId: revokeOutputException
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputException" }
        "404": { $ref: "#/components/responses/Problem" }

  /artifact-quarantines:
    get:
      tags: [artifacts]
      operationId: listArtifactQuarantines
      x-samuori-roles: [security-reviewer, administrator]
      parameters: [{ name: active, in: query, required: false, schema: { type: boolean } }]
      responses:
        "200":
          description: Images held because a compromised worker built them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactQuarantineList" }

  /artifact-quarantines/{quarantineId}/release:
    parameters: [{ name: quarantineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [artifacts]
      operationId: releaseArtifactQuarantine
      x-samuori-roles: [security-reviewer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1024 }
      responses:
        "200":
          description: Released after review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactQuarantine" }
        "404": { $ref: "#/components/responses/Problem" }

  /worker-pools/{poolId}/approval:
    parameters: [{ name: poolId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [workers]
      operationId: setPoolApproval
      description: Enables (approved true) or disables a pool, recorded as an immutable approval decision. Creating a pool already approves it. Untrusted builds also need a passing self-test.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolApproval" }
      responses:
        "200":
          description: Pool with the new approval state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPool" }
        "404": { $ref: "#/components/responses/Problem" }

  /worker-pools/{poolId}/self-tests:
    parameters: [{ name: poolId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [workers]
      operationId: runPoolSelfTest
      x-samuori-roles: [operator, administrator]
      description: Starts a self-test on every connected worker of the pool that can run its profile; each worker is verified on its own (OD-22).
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "202":
          description: Self-tests started, one operation per worker
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /enrollment-tokens:
    post:
      tags: [workers]
      operationId: createEnrollmentToken
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenRequest" }
      responses:
        "201":
          description: Single-use token returned once, never logged or retrievable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenIssued" }

  /secret-providers:
    get:
      tags: [secrets]
      operationId: listSecretProviders
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Provider profiles (no credentials)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProviderList" }
    post:
      tags: [secrets]
      operationId: createSecretProvider
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretProviderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProvider" }

  /allowed-secrets:
    get:
      tags: [secrets]
      operationId: listAllowedSecrets
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: The external secrets administrators may grant to projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedSecretList" }
    post:
      tags: [secrets]
      operationId: allowSecret
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedSecretCreate" }
      responses:
        "201":
          description: Allowed after reading it once to prove it exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedSecret" }

  /allowed-secrets/{allowedSecretId}:
    parameters: [{ name: allowedSecretId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    delete:
      tags: [secrets]
      operationId: removeAllowedSecret
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Removed; grants already made stay until revoked }

  /secret-providers/{providerId}:
    parameters: [{ name: providerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [secrets]
      operationId: updateSecretProvider
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretProviderUpdate" }
      responses:
        "200":
          description: Updated; the last test is cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProvider" }
    delete:
      tags: [secrets]
      operationId: deleteSecretProvider
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted with its stored credential }
        "409": { description: "Grants, bindings or signing keys use or used the store" }

  /secret-providers/{providerId}/test:
    parameters: [{ name: providerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [secrets]
      operationId: testSecretProvider
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Real connectivity test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }

  /secret-providers/{providerId}/local-secrets:
    parameters: [{ name: providerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [secrets]
      operationId: listLocalSecrets
      x-samuori-roles: [administrator, security-reviewer]
      responses:
        "200":
          description: Local secrets; metadata only, never values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSecretList" }
    post:
      tags: [secrets]
      operationId: storeLocalSecret
      description: Local encrypted provider only. The value is write-only and never returned. Storing under an existing name creates a new version.
      x-samuori-roles: [administrator]
      x-samuori-max-body-bytes: 131072
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalSecretWrite" }
      responses:
        "201":
          description: Stored; metadata only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSecret" }

  /secret-providers/{providerId}/local-secrets/{secretId}:
    parameters:
      - { name: providerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      - { name: secretId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      tags: [secrets]
      operationId: deleteLocalSecret
      description: Destroys every version. Refused with 409 while a project has an active grant or binding of the secret, or any Samuori record (credentials, keys, providers, channels, pipelines, history included) refers to it; the problem lists each use. A controller-only secret nothing refers to any more may be deleted.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted and audited }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/secret-bindings:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [secrets]
      operationId: listSecretBindings
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Bindings with provider references (admin only; never values)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretBindingList" }
    post:
      tags: [secrets]
      operationId: createSecretBinding
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretBindingCreate" }
      responses:
        "201":
          description: Binding created as a new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretBinding" }

  /projects/{projectId}/secret-grants:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [secrets]
      operationId: listSecretGrants
      description: Keys an administrator made available to the project, and which spec secret IDs use them. Provider references are returned to administrators only.
      x-samuori-roles: [developer, maintainer, security-reviewer, administrator]
      responses:
        "200":
          description: Active grants and the project's active bindings; never values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretGrantList" }
    post:
      tags: [secrets]
      operationId: createSecretGrant
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretGrantCreate" }
      responses:
        "201":
          description: Granted and audited; the reference was checked to resolve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretGrant" }

  /projects/{projectId}/secret-grants/{grantId}/revoke:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: grantId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [secrets]
      operationId: revokeSecretGrant
      description: Withdraws the key and disables every binding made from it at once.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretGrantRevoke" }
      responses:
        "204": { description: Revoked and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/secret-grants/{grantId}/refresh:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: grantId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      tags: [secrets]
      operationId: refreshSecretGrantKeys
      description: Rereads a key set's key names. Bindings to keys that no longer exist are disabled.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: The grant with its current key names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretGrant" }

  /projects/{projectId}/secret-grant-bindings:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [secrets]
      operationId: bindSecretGrant
      description: Binds a spec secret ID to one of the project's granted keys, replacing any earlier binding of that ID. Only active grants of this project can be bound.
      x-samuori-roles: [developer, maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretGrantBind" }
      responses:
        "201":
          description: Bound and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretGrantUse" }

  /secret-bindings/{bindingId}/actions:
    parameters: [{ name: bindingId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [secrets]
      operationId: applySecretBindingAction
      description: Rotate (new version; invalidates dependent cache scopes) or disable (immediate).
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretBindingAction" }
      responses:
        "200":
          description: Updated binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretBinding" }

  /projects/{projectId}/secret-requests:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [secrets]
      operationId: requestSecretBinding
      description: A developer asks project admins to bind a logical secret ID. Creates an approval.
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretBindingRequest" }
      responses:
        "202":
          description: Approval created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }

  /projects/{projectId}/repository-requests:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [registries]
      operationId: listRepositoryRequests
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: The project's repository requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRequestList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [registries]
      operationId: requestRepository
      description: "Asks administrators for a publication repository (D03). Creates an approval that only administrators decide, by fulfilling it with a destination open to the project or by rejecting it."
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryRequestCreate" }
      responses:
        "202":
          description: Requested; an approval is pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/base-image-requests:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [policies]
      operationId: listBaseImageRequests
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: The project's base-image requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseImageRequestList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [policies]
      operationId: requestBaseImage
      description: "Asks organization administrators to add an outside base-image repository to the base-images policy. Creates an approval that only organization administrators other than the requester decide; approving it adds the repository to the policy as a new version."
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaseImageRequestCreate" }
      responses:
        "202":
          description: Requested; an approval is pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseImageRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/egress-access-requests:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [policies]
      operationId: listEgressAccessRequests
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: The project's egress access requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressAccessRequestList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [policies]
      operationId: requestEgressAccess
      description: >-
        Asks organization administrators to open egress presets or public destinations for this project's builds of one
        method only (ADR 0052). The server checks every entry against stored evidence: a readiness item it recomputes
        from the named discovery or admission check, or the destinations a build's egress proxy denied. Approving it
        creates project egress allowances; it never changes the organization egress policy.
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressAccessRequestCreate" }
      responses:
        "202":
          description: Requested; an approval is pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressAccessRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/egress-allowances:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [policies]
      operationId: listEgressAllowances
      x-samuori-roles: [developer, maintainer, publisher, administrator]
      responses:
        "200":
          description: The project's egress allowances, including revoked and expired ones, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressAllowanceList" }
        "404": { $ref: "#/components/responses/Problem" }

  /egress-allowances/{allowanceId}/revocation:
    parameters: [{ name: allowanceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [policies]
      operationId: revokeEgressAllowance
      description: Revokes a project egress allowance; builds planned afterwards no longer get it. Organization administrators only.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressAllowanceRevocation" }
      responses:
        "200":
          description: Revoked and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressAllowance" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /egress-allowances/by-destination:
    get:
      tags: [policies]
      operationId: listGrantedDestinations
      description: The organization's active project egress allowances for destinations, grouped by destination and network, most projects first, with active preset allowances listed separately. Organization administrators only.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Granted destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantedDestinations" }
        "403": { $ref: "#/components/responses/Problem" }

  /egress-allowances/promotion:
    post:
      tags: [policies]
      operationId: promoteEgressDestination
      description: >-
        Adds a destination to the organization egress policy for every build method (optionally not Dockerfile
        builds) and revokes the project allowances it replaces, in one transaction. Organization administrators only;
        audited (docs/architecture/egress.md#promoting-project-allowances).
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressPromotionRequest" }
      responses:
        "200":
          description: The policy version that opens it and the revoked allowances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPromotion" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /approvals/{approvalId}/fulfillment:
    parameters: [{ name: approvalId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [registries]
      operationId: fulfillRepositoryRequest
      description: "Approves a repository request by linking a destination open to its project (and in the requested registry, if one was named). Create the repository and the destination first."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryFulfillment" }
      responses:
        "200":
          description: Approved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /registries:
    get:
      tags: [registries]
      operationId: listRegistries
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Registries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryList" }
    post:
      tags: [registries]
      operationId: createRegistry
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }

  /registries/{registryId}:
    parameters: [{ name: registryId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [registries]
      operationId: updateRegistry
      description: "Validated like a new registry; the kind cannot change. The endpoint, plain HTTP, account and region cannot change while any of the registry's credentials holds a stored secret, so a stored credential is never sent elsewhere: delete those credentials first."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [registries]
      operationId: deleteRegistry
      description: Refused with 409 while credentials, destinations, image sources, repository requests or publications refer to the registry; the problem lists each use.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /registries/{registryId}/repositories:
    parameters: [{ name: registryId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [registries]
      operationId: listEcrRepositories
      description: Repositories an ECR profile can see in its registry, for choosing a destination.
      x-samuori-roles: [administrator]
      parameters: [{ name: profileId, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }]
      responses:
        "200":
          description: ECR repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EcrRepositoryList" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [registries]
      operationId: createEcrRepository
      description: Creates an ECR repository with the given profile, whose role should be allowed only to create repositories (D03). Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profileId, name]
              properties:
                profileId: { $ref: "#/components/schemas/Id" }
                name: { type: string, maxLength: 256 }
                immutableTags: { type: boolean, default: true }
                scanOnPush: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EcrRepository" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /registry-credential-profiles:
    get:
      tags: [registries]
      operationId: listRegistryCredentialProfiles
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Profiles; credentials appear only as secret references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryCredentialProfileList" }
    post:
      tags: [registries]
      operationId: createRegistryCredentialProfile
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryCredentialProfileCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryCredentialProfile" }

  /registry-credential-profiles/{profileId}:
    parameters: [{ name: profileId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [registries]
      operationId: updateRegistryCredentialProfile
      description: "Validated like new credentials; the registry and purpose cannot change, so a stored secret stays with its registry. An ECR profile keeping its stored access key cannot change its API endpoint. The last test is cleared."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryCredentialProfileUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryCredentialProfile" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [registries]
      operationId: deleteRegistryCredentialProfile
      description: Refused with 409 while destinations or image sources use the credentials. The secret stays reserved for the controller.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /registry-credential-profiles/{profileId}/test:
    parameters: [{ name: profileId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [registries]
      operationId: testRegistryCredentialProfile
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Real connectivity and permission test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }

  /destinations:
    get:
      tags: [registries]
      operationId: listDestinations
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Publication destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DestinationList" }
    post:
      tags: [registries]
      operationId: createDestination
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }

  /destinations/{destinationId}:
    parameters: [{ name: destinationId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [registries]
      operationId: updateDestination
      description: "Validated like a new destination. The registry cannot change, and the repository cannot change once a publication or repository request refers to the destination; its policy can."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [publication]
      operationId: deleteDestination
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted }
        "409": { description: "Publications or repository requests refer to it" }

  /image-sources:
    get:
      tags: [registries]
      operationId: listImageSources
      description: Approved private image sources. Administrators see all; others see only their teams' sources, without credentials.
      x-samuori-roles: [developer, maintainer, publisher, security-reviewer, administrator]
      responses:
        "200":
          description: Approved image sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSourceList" }
    post:
      tags: [registries]
      operationId: createImageSource
      description: "Approves pulls of upstream repositories through an authorizing mirror for the listed teams. One mirror serves one team unless shared mirrors are enabled (OD-14)."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageSourceCreate" }
      responses:
        "201":
          description: Created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSource" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /image-sources/{sourceId}/state:
    parameters: [{ name: sourceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [registries]
      operationId: setImageSourceState
      description: Disabling stops new mirror tokens at once; issued tokens expire within five minutes.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnabledState" }
      responses:
        "204": { description: Updated and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /image-sources/{sourceId}/mirror-config:
    parameters: [{ name: sourceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [registries]
      operationId: getImageSourceMirrorConfig
      description: A CNCF Distribution configuration for the source's mirror and the certificates it must trust. The upstream password is never included.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Mirror configuration
          content:
            application/json:
              schema:
                type: object
                required: [config, trustBundle]
                properties:
                  config: { type: string }
                  trustBundle: { type: string, description: PEM certificates of Samuori's mirror token keys }
        "404": { $ref: "#/components/responses/Problem" }

  /mirror-token-keys/rotations:
    post:
      tags: [registries]
      operationId: rotateMirrorTokenKey
      description: Creates a new mirror token signing key; mirrors must trust its certificate before it signs. Retired keys stay in the trust bundle for a day.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "201":
          description: The new certificate
          content:
            application/json:
              schema:
                type: object
                required: [certificate]
                properties:
                  certificate: { type: string }

  /policies:
    get:
      tags: [policies]
      operationId: listPolicies
      x-samuori-roles: [administrator, security-reviewer]
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyList" }

  /policies/{policyId}:
    parameters: [{ name: policyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [policies]
      operationId: replacePolicy
      description: "A change that would newly block specs needs X-Samuori-Confirm from a dry run of the same document and a reason (TM-92); without them the answer is 428 with the impact."
      x-samuori-roles: [administrator]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { name: X-Samuori-Confirm, in: header, schema: { type: string, maxLength: 512 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyWrite" }
      responses:
        "200":
          description: New policy version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  /policies/{policyId}/dry-run:
    parameters: [{ name: policyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [policies]
      operationId: dryRunPolicy
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyWrite" }
      responses:
        "200":
          description: Impact preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyImpact" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      description: The caller's inbox, newest first.
      x-samuori-roles: [any]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      x-samuori-roles: [any]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Id" }
      responses:
        "204": { description: "Marked read: one notification, or all when no ID is given" }

  /notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Channels (secrets never included)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannelList" }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      description: "Webhook: Samuori generates the signing key and returns it once. Slack and Teams: give the incoming webhook URL as the secret. Email: recipients; the controller needs an SMTP server."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelCreate" }
      responses:
        "201":
          description: Created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannelCreated" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /notification-channels/{channelId}:
    parameters: [{ name: channelId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [notifications]
      operationId: updateNotificationChannel
      description: "Edits a channel; its kind is fixed. Slack and Teams: a new incoming webhook URL as the secret replaces the stored one, or leave it out to keep it. Webhooks keep their signing key. Audited without the secret."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /notification-channels/{channelId}/state:
    parameters: [{ name: channelId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [notifications]
      operationId: setNotificationChannelState
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnabledState" }
      responses:
        "204": { description: Updated and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /notification-channels/{channelId}/test:
    parameters: [{ name: channelId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      description: Sends a test message now; the result is audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "404": { $ref: "#/components/responses/Problem" }

  /notification-rules:
    get:
      tags: [notifications]
      operationId: listNotificationRules
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Routing rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRuleList" }
    post:
      tags: [notifications]
      operationId: createNotificationRule
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationRuleCreate" }
      responses:
        "201":
          description: Created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRule" }
        "422": { $ref: "#/components/responses/Problem" }

  /notification-rules/{ruleId}:
    parameters: [{ name: ruleId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    put:
      tags: [notifications]
      operationId: updateNotificationRule
      description: Changes a rule's channel, events and scope. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationRuleCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRule" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [notifications]
      operationId: deleteNotificationRule
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /notification-deliveries:
    get:
      tags: [notifications]
      operationId: listNotificationDeliveries
      x-samuori-roles: [administrator]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, delivered, dead] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Recent deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDeliveryList" }

  /notification-deliveries/{deliveryId}/retry:
    parameters: [{ name: deliveryId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [notifications]
      operationId: retryNotificationDelivery
      description: Returns a dead-lettered delivery to the queue; audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Queued again }
        "404": { $ref: "#/components/responses/Problem" }

  /pipelines:
    get:
      tags: [pipelines]
      operationId: listPipelines
      description: "A project's pipelines; administrators may omit projectId to list the organization's."
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      parameters:
        - { name: projectId, in: query, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Pipelines (credentials never included)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineList" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [pipelines]
      operationId: createPipeline
      description: "Samuori generates the webhook secret and returns it once. The optional repository token is stored for the controller only."
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineCreate" }
      responses:
        "201":
          description: Created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineCreated" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /pipelines/{pipelineId}:
    parameters: [{ name: pipelineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [pipelines]
      operationId: getPipeline
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/Problem" }

  /pipelines/{pipelineId}/state:
    parameters: [{ name: pipelineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [pipelines]
      operationId: setPipelineState
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnabledState" }
      responses:
        "204": { description: Updated and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /pipelines/{pipelineId}/hook-secret:
    parameters: [{ name: pipelineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [pipelines]
      operationId: rotatePipelineHookSecret
      description: Replaces the webhook secret and returns the new one once; the old secret stops working at once.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: The new secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineSecretIssued" }
        "404": { $ref: "#/components/responses/Problem" }

  /pipelines/{pipelineId}/runs:
    parameters: [{ name: pipelineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [pipelines]
      operationId: listPipelineRuns
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRunList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [pipelines]
      operationId: startPipelineRun
      description: "Queues a run of one ref, by hand or from external CI with an API token. The caller and the pipeline's owner both need a build role on the project."
      x-samuori-roles: [developer, maintainer]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRunCreate" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /hooks/pipelines/{pipelineId}:
    parameters: [{ name: pipelineId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [pipelines]
      operationId: receivePipelineHook
      description: "Git push webhook. Verified with X-Hub-Signature-256 (HMAC-SHA256 of the body) or X-Gitlab-Token before the body is read. Unknown pipelines and failed verification get the same 401. The payload selects a ref and names a commit only."
      security: []
      x-samuori-public: true
      x-samuori-signed: true
      x-samuori-max-body-bytes: 1048576
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted, ignored or a duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineHookResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      description: Searches the organization's audit events, newest first.
      x-samuori-roles: [administrator, security-reviewer]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/AuditResourceType" }
        - { $ref: "#/components/parameters/AuditResourceId" }
        - { $ref: "#/components/parameters/AuditSince" }
        - { $ref: "#/components/parameters/AuditUntil" }
        - { $ref: "#/components/parameters/AuditActorId" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditRequestId" }
        - { $ref: "#/components/parameters/AuditText" }
      responses:
        "200":
          description: Append-only audit events (never secret values)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400": { $ref: "#/components/responses/Problem" }

  /audit-events/export:
    get:
      tags: [audit]
      operationId: exportAuditEvents
      description: Downloads matching events as JSON Lines, oldest first, at most 100000 events. The export is audited.
      x-samuori-roles: [administrator, security-reviewer]
      parameters:
        - { $ref: "#/components/parameters/AuditResourceType" }
        - { $ref: "#/components/parameters/AuditResourceId" }
        - { $ref: "#/components/parameters/AuditSince" }
        - { $ref: "#/components/parameters/AuditUntil" }
        - { $ref: "#/components/parameters/AuditActorId" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditRequestId" }
        - { $ref: "#/components/parameters/AuditText" }
      responses:
        "200":
          description: One audit event per line; X-Samuori-Truncated is true when the limit was reached
          content:
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }

  /audit-policy:
    get:
      tags: [audit]
      operationId: getAuditPolicy
      x-samuori-roles: [administrator, security-reviewer]
      responses:
        "200":
          description: Retention and scheduled export policy, with the last export and purge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPolicy" }
    put:
      tags: [audit]
      operationId: setAuditPolicy
      description: Events younger than 30 days are never purged. Purging only exported events needs scheduled export.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditPolicyUpdate" }
      responses:
        "200":
          description: Policy saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPolicy" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /operations/{operationId}:
    parameters: [{ name: operationId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [system]
      operationId: getOperation
      x-samuori-roles: [any]
      responses:
        "200":
          description: Async operation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/kube-providers:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [kubernetes]
      operationId: listKubeProviders
      description: The conversion providers this project may use now, with the inputs and formats each supports and its maintenance status, for the wizard. Shows availability only, never provider pins or scope (ADR 0048).
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Conversion providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeProviderList" }
        "404": { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/kube-conversions:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [kubernetes]
      operationId: listKubeConversions
      description: The project's Kubernetes conversions, newest first, each with its latest run (ADR 0048).
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Conversions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [kubernetes]
      operationId: createKubeConversion
      description: "Queues a conversion of a Compose file, source or Samuori image with an approved provider. It runs on a worker inside build isolation with no network and no credentials; Samuori validates the result. Audited. Samuori never applies the result to a cluster."
      x-samuori-roles: [developer, maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeConversionCreate" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversion" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }]
    get:
      tags: [kubernetes]
      operationId: getKubeConversion
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Conversion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversion" }
        "404": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/runs:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }]
    get:
      tags: [kubernetes]
      operationId: listKubeConversionRuns
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionRunList" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [kubernetes]
      operationId: rerunKubeConversion
      description: Runs the provider again with new options, or with answers to the questions it returned. Refused while a run is active. Audited.
      x-samuori-roles: [developer, maintainer, administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeConversionRerun" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversion" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/revisions:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }]
    get:
      tags: [kubernetes]
      operationId: listKubeConversionRevisions
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Revisions, newest first, without file contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionRevisionList" }
        "404": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/revisions/{revision}:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }, { $ref: "#/components/parameters/Revision" }]
    get:
      tags: [kubernetes]
      operationId: getKubeConversionRevision
      description: A revision's files (paths, digests and sizes), findings and lineage.
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionRevision" }
        "404": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/revisions/{revision}/findings:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }, { $ref: "#/components/parameters/Revision" }]
    get:
      tags: [kubernetes]
      operationId: getKubeConversionFindings
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: Findings, errors first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionFindingList" }
        "404": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/revisions/{revision}/file:
    parameters:
      - { $ref: "#/components/parameters/ConversionId" }
      - { $ref: "#/components/parameters/Revision" }
      - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
    get:
      tags: [kubernetes]
      operationId: getKubeConversionFile
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: The file's content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionFile" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [kubernetes]
      operationId: editKubeConversionFile
      description: Stores the changed or added file as a new revision based on this one; every file is validated again and literal secrets are replaced by references. Audited.
      x-samuori-roles: [developer, maintainer, administrator]
      x-samuori-max-body-bytes: 600000
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeConversionFileEdit" }
      responses:
        "201":
          description: The new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeConversionRevision" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /kube-conversions/{conversionId}/revisions/{revision}/bundle:
    parameters: [{ $ref: "#/components/parameters/ConversionId" }, { $ref: "#/components/parameters/Revision" }]
    get:
      tags: [kubernetes]
      operationId: downloadKubeConversionBundle
      description: The revision's files and a samuori-review.json with its findings and lineage, as a ZIP. It holds no credentials. Audited.
      x-samuori-roles: [developer, maintainer, publisher, operator, security-reviewer, administrator]
      responses:
        "200":
          description: ZIP bundle
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: samuori_session
      description: Browser session (httpOnly, Secure, SameSite). Unsafe methods also require X-CSRF-Token.
    bearerToken:
      type: http
      scheme: bearer
      description: Scoped, expiring API token or OIDC access token. Worker identities are never accepted.

  headers:
    ETag:
      schema: { type: string, maxLength: 128 }

  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    AuditResourceType: { name: resourceType, in: query, schema: { type: string, maxLength: 64 } }
    AuditResourceId: { name: resourceId, in: query, schema: { type: string, maxLength: 256 } }
    AuditSince: { name: since, in: query, schema: { type: string, format: date-time } }
    AuditUntil: { name: until, in: query, schema: { type: string, format: date-time } }
    AuditActorId: { name: actorId, in: query, schema: { type: string, maxLength: 64 } }
    AuditAction: { name: action, in: query, description: "An action such as publication.published, or a prefix ending in * such as publication.*", schema: { type: string, maxLength: 128 } }
    AuditOutcome: { name: outcome, in: query, schema: { type: string, maxLength: 64 } }
    AuditRequestId: { name: requestId, in: query, schema: { type: string, maxLength: 64 } }
    AuditText: { name: q, in: query, description: Text found in the event's reason, schema: { type: string, maxLength: 200 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, maxLength: 128 } }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      description: Required with session cookies; ignored with bearer tokens.
      schema: { type: string, maxLength: 128 }
    ProjectId: { name: projectId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    SpecId: { name: specId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    Revision: { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    SnapshotId: { name: snapshotId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    UploadId: { name: uploadId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    BuildId: { name: buildId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ArtifactId: { name: artifactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    DeployPublicationId: { name: publicationId, in: query, required: false, description: "A successful publication of the image to reference; the newest one when omitted", schema: { $ref: "#/components/schemas/Id" } }
    WorkerId: { name: workerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ConversionId: { name: conversionId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }

  responses:
    Problem:
      description: Typed error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: ULID }
    Digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    Timestamp: { type: string, format: date-time }
    LogicalSecretId: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    NextCursor: { type: string, nullable: true, maxLength: 512 }

    Problem:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, maxLength: 64, example: secret_binding_missing }
        message: { type: string, maxLength: 1024 }
        details: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ProblemDetail" } }
        requestId: { type: string, maxLength: 64 }
    ProblemDetail:
      type: object
      properties:
        field: { type: string, maxLength: 256 }
        code: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 1024 }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, unavailable, not-configured] }
              checkedAt: { $ref: "#/components/schemas/Timestamp" }

    Principal:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, service, system] }
        id: { $ref: "#/components/schemas/Id" }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, format: password, writeOnly: true, maxLength: 1024 }
        providerId: { $ref: "#/components/schemas/Id" }
    SignInProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, kind]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              name: { type: string }
              kind: { type: string, enum: [oidc, ldap] }
    OidcSettings:
      type: object
      required: [issuer, clientId]
      properties:
        issuer: { type: string, maxLength: 512 }
        clientId: { type: string, maxLength: 256 }
        scopes: { type: array, maxItems: 16, items: { type: string, maxLength: 64 } }
        usernameClaim: { type: string, maxLength: 64 }
        displayNameClaim: { type: string, maxLength: 64 }
        groupsClaim: { type: string, maxLength: 64 }
    LdapSettings:
      type: object
      required: [url, bindDn, userBaseDn, userFilter]
      properties:
        url: { type: string, maxLength: 512, description: "One to eight ldaps:// or ldap:// URLs separated by spaces, tried in order" }
        startTls: { type: boolean }
        caCertPem: { type: string, maxLength: 65536, description: "PEM CA certificates for the directory's TLS certificate; text outside the certificate blocks is ignored" }
        bindDn: { type: string, maxLength: 512 }
        userBaseDn: { type: string, maxLength: 512 }
        userFilter: { type: string, maxLength: 512, description: "Contains {username}, always escaped" }
        usernameAttribute: { type: string, maxLength: 64 }
        displayNameAttribute: { type: string, maxLength: 64 }
        groupBaseDn: { type: string, maxLength: 512 }
        groupFilter: { type: string, maxLength: 512, description: "Contains {dn}, always escaped" }
        groupNameAttribute: { type: string, maxLength: 64 }
    IdentityProviderCreate:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [oidc, ldap] }
        name: { type: string, maxLength: 63 }
        displayName: { type: string, maxLength: 64 }
        secretId: { $ref: "#/components/schemas/Id" }
        oidc: { $ref: "#/components/schemas/OidcSettings" }
        ldap: { $ref: "#/components/schemas/LdapSettings" }
    BuildMethodPolicy:
      type: object
      additionalProperties: false
      required: [allowed, default]
      properties:
        allowed: { type: array, minItems: 1, items: { type: string, enum: [recipe, dockerfile, railpack, buildpacks] } }
        default: { type: string, enum: ["", recipe, dockerfile, railpack, buildpacks], description: Empty means Samuori recommends a method from discovery }
    ProviderConfig:
      type: object
      additionalProperties: false
      required: [enabled, version, artifacts, pools, projects, egressPresets, timeoutSeconds]
      properties:
        enabled: { type: boolean }
        version: { type: string, maxLength: 64 }
        artifacts: { type: object, additionalProperties: { type: string, maxLength: 512 } }
        pools: { type: array, items: { $ref: "#/components/schemas/Id" }, description: Empty allows every pool }
        projects: { type: array, items: { $ref: "#/components/schemas/Id" }, description: Empty allows every project }
        egressPresets: { type: array, items: { type: string, maxLength: 64 } }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 7200, description: "0 uses the default" }
        runAsRoot: { type: boolean, description: "Railpack only: keep Railpack's root image user instead of the non-root user layer Samuori adds (uid:gid 10001:10001, ADR 0047)" }
    ProviderArtifact:
      type: object
      required: [key, description, image]
      properties:
        key: { type: string }
        description: { type: string }
        image: { type: boolean }
    Provider:
      type: object
      required: [name, kind, displayName, license, architectures, prerequisites, artifacts, config, workers]
      properties:
        name: { type: string }
        kind: { type: string, enum: [build, conversion] }
        displayName: { type: string }
        method: { type: string }
        license: { type: string }
        architectures: { type: array, items: { type: string } }
        prerequisites: { type: array, items: { type: string } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ProviderArtifact" } }
        maintenance: { type: string }
        workerVersion: { type: string, description: "What capable workers report when nothing is installed for the provider, such as the CNB platform API for buildpacks; empty means the approved version" }
        config: { $ref: "#/components/schemas/ProviderConfig" }
        workers:
          type: object
          required: [online, withApprovedVersion]
          properties:
            online: { type: integer, description: Online workers that report this provider }
            withApprovedVersion: { type: integer, description: Online workers that can run the approved provider }
            versions: { type: object, additionalProperties: { type: integer }, description: Online workers by reported version }
    BuildMethodOptions:
      type: object
      required: [methods, default]
      properties:
        default: { type: string, description: "The organization's default method; empty means Samuori recommends one from discovery" }
        methods:
          type: array
          items:
            type: object
            required: [method, available]
            properties:
              method: { type: string, enum: [recipe, dockerfile, railpack, buildpacks] }
              available: { type: boolean }
              reason: { type: string, description: Why the method cannot be used now }
    RailpackLineage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [attempt]
            properties:
              attempt: { type: integer }
              plan: { type: object, additionalProperties: true, description: "The plan as built, with approved digest-pinned images and secret names only" }
              info: { type: object, additionalProperties: true, description: "Railpack's railpack-info.json" }
    BuildpacksLineage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [attempt]
            properties:
              attempt: { type: integer }
              metadata:
                type: object
                additionalProperties: true
                description: "builder, runImage, platformApi, lifecycleVersion, image (manifest, user, entrypoint), buildMetadata (io.buildpacks.build.metadata: buildpacks, processes, launcher), lifecycleMetadata, projectMetadata and the lifecycle report"
              sbom:
                type: object
                required: [digest, sizeBytes]
                properties:
                  digest: { type: string }
                  sizeBytes: { type: integer, format: int64 }
    ProviderList:
      type: object
      required: [items, policy]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        policy: { $ref: "#/components/schemas/BuildMethodPolicy" }
    TopologyPlan:
      type: object
      additionalProperties: false
      required: [deployment, controllers, workers, databaseReplicated, storageReplicated]
      properties:
        deployment: { type: string, enum: [single-server, cluster] }
        controllers: { type: integer, minimum: 1, maximum: 7 }
        workers: { type: integer, minimum: 0, maximum: 1000 }
        databaseReplicated: { type: boolean, description: Declared by the administrator; Samuori cannot measure it }
        storageReplicated: { type: boolean, description: Declared for an OCI repository; S3 counts as replicated }
        updatedAt: { type: string, format: date-time, readOnly: true }
    TopologyComponent:
      type: object
      required: [name, have, tolerates]
      properties:
        name: { type: string }
        have: { type: string }
        tolerates: { type: integer, description: Failures this component survives }
        declared: { type: boolean, description: "Rests on the administrator's declaration, not a measurement" }
        gap: { type: string, description: What to add for this component to survive a failure }
    TopologyAssessment:
      type: object
      required: [tier, components]
      properties:
        tier: { type: string, enum: [standalone, partial-ha, ha] }
        components: { type: array, items: { $ref: "#/components/schemas/TopologyComponent" } }
        warnings: { type: array, items: { type: string } }
    TopologyStatus:
      type: object
      required: [live, liveControllers, liveWorkers]
      properties:
        plan: { $ref: "#/components/schemas/TopologyPlan" }
        planned: { $ref: "#/components/schemas/TopologyAssessment" }
        live: { $ref: "#/components/schemas/TopologyAssessment" }
        liveControllers: { type: integer }
        liveWorkers: { type: integer }
    IdentityProviderUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, maxLength: 64 }
        secretId: { $ref: "#/components/schemas/Id" }
        oidc: { $ref: "#/components/schemas/OidcSettings" }
        ldap: { $ref: "#/components/schemas/LdapSettings" }
    IdentityProvider:
      type: object
      required: [id, kind, name, displayName, enabled, hasSecret, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [oidc, ldap] }
        name: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
        hasSecret: { type: boolean }
        oidc: { $ref: "#/components/schemas/OidcSettings" }
        ldap: { $ref: "#/components/schemas/LdapSettings" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    IdentityProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IdentityProvider" } }
    EnabledState:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    GroupMappingCreate:
      type: object
      additionalProperties: false
      required: [group, role, scopeType, scopeId]
      properties:
        group: { type: string, maxLength: 512 }
        role: { type: string, enum: [developer, maintainer, publisher, operator, security-reviewer, administrator] }
        scopeType: { type: string, enum: [organization, team, project] }
        scopeId: { $ref: "#/components/schemas/Id" }
    GroupMapping:
      type: object
      required: [id, group, role, scopeType, scopeId]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        group: { type: string }
        role: { type: string }
        scopeType: { type: string }
        scopeId: { $ref: "#/components/schemas/Id" }
    GroupMappingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
    IdentitySettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        localLogin: { type: string, enum: [all, administrators], description: "administrators keeps local passwords only for organization administrators, as audited recovery access" }
        session: { $ref: "#/components/schemas/SessionTimeouts" }
    IdentitySettings:
      type: object
      required: [localLogin, session]
      properties:
        localLogin: { type: string, enum: [all, administrators] }
        session: { $ref: "#/components/schemas/SessionTimeouts" }
        oidcRedirectUrl: { type: string, description: "Register this with OIDC providers; absent until the external URL is configured" }
    SessionTimeouts:
      type: object
      additionalProperties: false
      required: [idleTimeoutMinutes, maxSessionHours, warningSeconds]
      properties:
        idleTimeoutMinutes: { type: integer, minimum: 15, maximum: 120, description: "Inactivity that ends a browser session; not longer than the maximum session" }
        maxSessionHours: { type: integer, minimum: 1, maximum: 24, description: "Absolute session length; activity never extends it" }
        warningSeconds: { type: integer, minimum: 30, maximum: 600, description: "How long before the idle deadline the portal warns" }
    SessionStatus:
      type: object
      required: [idleExpiresAt, absoluteExpiresAt, serverTime, idleTimeoutSeconds, maxSessionSeconds, warningSeconds]
      properties:
        idleExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        absoluteExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        serverTime: { $ref: "#/components/schemas/Timestamp" }
        idleTimeoutSeconds: { type: integer }
        maxSessionSeconds: { type: integer }
        warningSeconds: { type: integer }
    ServiceIdentityCreate:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: { type: string, maxLength: 63 }
        displayName: { type: string, maxLength: 128 }
    ServiceIdentity:
      type: object
      required: [id, username, displayName, disabled, createdAt, tokens]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        displayName: { type: string }
        disabled: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        tokens: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    ServiceIdentityList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ServiceIdentity" } }

    SetupStatus:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }
    BootstrapRequest:
      type: object
      required: [token, organizationName, username, password]
      properties:
        token: { type: string, writeOnly: true, maxLength: 256 }
        organizationName: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,63}$" }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024, description: "At least 12 characters and not containing the username; the server enforces the policy (dev.weakPasswords relaxes it on a local development server)" }

    Me:
      type: object
      required: [principal, roles]
      properties:
        principal: { $ref: "#/components/schemas/Principal" }
        displayName: { type: string }
        developerDownloads:
          type: boolean
          description: The organization lets developers download validated images (publication policy, ADR 0053).
        roles:
          type: array
          items:
            type: object
            required: [role, scopeType, scopeId]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              scopeType: { type: string, enum: [organization, team, project] }
              scopeId: { $ref: "#/components/schemas/Id" }
    Role:
      type: string
      enum: [developer, maintainer, publisher, operator, security-reviewer, administrator]

    ApiTokenRequest:
      type: object
      required: [name, expiresAt, scopes]
      properties:
        name: { type: string, maxLength: 128 }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        scopes: { type: array, minItems: 1, items: { type: string, enum: [read, write] } }
    ApiToken:
      type: object
      required: [id, name, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        lastUsedAt: { $ref: "#/components/schemas/Timestamp" }
    ApiTokenIssued:
      allOf:
        - { $ref: "#/components/schemas/ApiToken" }
        - type: object
          required: [token]
          properties:
            token: { type: string, x-samuori-reveal-once: true, description: Shown once; stored only as a hash }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    Team:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
    TeamList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Team" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    TeamCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,63}$" }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024, description: "At least 12 characters and not containing the username; the server enforces the policy (dev.weakPasswords relaxes it on a local development server)" }
    User:
      type: object
      required: [id, username, displayName, disabled, roles]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        displayName: { type: string }
        disabled: { type: boolean }
        source: { type: string, description: "The identity provider that created the user; absent for local accounts" }
        roles: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    RoleBindingCreate:
      type: object
      required: [principalId, role, scopeType, scopeId]
      properties:
        principalId: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        scopeType: { type: string, enum: [organization, team, project] }
        scopeId: { $ref: "#/components/schemas/Id" }
    RoleBinding:
      type: object
      required: [id, role, scopeType, scopeId]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        scopeType: { type: string, enum: [organization, team, project] }
        scopeId: { $ref: "#/components/schemas/Id" }
        source: { type: string, description: "The identity provider whose group mapping granted the role; it is granted again at that user's next sign-in" }

    ProjectCreate:
      type: object
      required: [teamId, name]
      properties:
        teamId: { $ref: "#/components/schemas/Id" }
        name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
        publicationMode: { type: string, enum: [manual, automatic], default: manual }
    ProjectUpdate:
      type: object
      required: [publicationMode]
      properties:
        publicationMode: { type: string, enum: [manual, automatic] }
    ImageSummary:
      type: object
      required: [artifactId, digest, buildRunId, createdAt, publications]
      properties:
        artifactId: { $ref: "#/components/schemas/Id" }
        digest: { $ref: "#/components/schemas/Digest" }
        buildRunId: { $ref: "#/components/schemas/Id" }
        version: { type: string, description: "<UTC date>.<n>, counted per project and day (ADR 0054)" }
        app: { type: string, description: The BuildSpec metadata.name }
        sizeBytes: { type: integer }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        validation: { $ref: "#/components/schemas/ValidationSummary" }
        publications:
          type: array
          items:
            type: object
            required: [id, destinationId, state, tags]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              destinationId: { $ref: "#/components/schemas/Id" }
              destinationName: { type: string }
              state: { type: string }
              tags: { type: array, items: { type: string } }
              destinationRef: { type: string }
    ImageSummaryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImageSummary" } }
    Project:
      type: object
      required: [id, teamId, name, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        teamId: { $ref: "#/components/schemas/Id" }
        teamName: { type: string, description: "The owning team's name, visible to anyone who can see the project." }
        name: { type: string }
        publicationMode: { type: string, enum: [manual, automatic] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        state: { type: string, enum: [active, archived, purged], description: "Archived and purged projects accept no new work (ADR 0058)." }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        archivedBy: { type: string, description: Display name of who archived the project }
        purgedAt: { $ref: "#/components/schemas/Timestamp" }
        purgedBy: { type: string, description: Display name of who purged the project }
    ProjectArchiveRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1024 }
    ProjectArchive:
      type: object
      required: [project, revoked, cancelledBuilds, closedUploads, notes]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        revoked:
          type: object
          description: What archiving revoked or closed; none of it returns on restore.
          required: [secretGrants, secretBindings, egressAllowances, destinations, federationGrants, pipelines, outputExceptions, requests]
          properties:
            secretGrants: { type: integer }
            secretBindings: { type: integer }
            egressAllowances: { type: integer }
            destinations: { type: integer, description: Publication destinations no longer open to the project }
            federationGrants: { type: integer }
            pipelines: { type: integer, description: Pipelines disabled }
            outputExceptions: { type: integer }
            requests: { type: integer, description: Pending approvals and requests expired }
        cancelledBuilds: { type: integer }
        closedUploads: { type: integer }
        notes: { type: array, items: { type: string }, description: Builds or uploads that could not be stopped }
    ProjectPurge:
      type: object
      required: [project, snapshots, builds, removedBlobs, keptBlobs, externalCopies]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        snapshots: { type: integer, description: Uploads marked deleted by this purge }
        builds: { type: integer, description: Builds marked deleted by this purge }
        removedBlobs: { type: integer, description: Stored files removed }
        keptBlobs: { type: integer, description: "Stored files kept because another project, a hold or a release still uses them" }
        externalCopies: { type: string, description: States that images already pushed to external registries were not deleted }
    ProjectList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    UploadSessionCreate:
      type: object
      required: [fileCount, totalBytes]
      properties:
        fileCount: { type: integer, minimum: 1, description: Number of files in the archive }
        totalBytes: { type: integer, format: int64, minimum: 1, description: "Exact archive size in bytes (TAR, TAR.GZ or ZIP)" }
        excludePatterns: { type: array, maxItems: 200, items: { type: string, maxLength: 256 } }
    UploadPolicy:
      type: object
      required: [maxArchiveBytes, maxFiles, maxFileBytes, chunkBytes, defaultExcludes, keptFiles, secretFilePatterns]
      properties:
        maxArchiveBytes: { type: integer, format: int64 }
        maxFiles: { type: integer }
        maxFileBytes: { type: integer, format: int64 }
        chunkBytes: { type: integer, format: int64 }
        defaultExcludes: { type: array, items: { type: string }, description: "Patterns without / match any path segment; others match the path or a parent" }
        keptFiles: { type: array, items: { type: string }, description: "Names kept even though a default pattern matches them" }
        secretFilePatterns: { type: array, items: { type: string }, description: "Default patterns that usually match credential files" }
    UploadSession:
      type: object
      required: [id, projectId, status, totalBytes, chunkBytes, maxChunks, receivedChunks, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [open, committing, committed, failed, expired] }
        totalBytes: { type: integer, format: int64 }
        chunkBytes: { type: integer, format: int64, description: "Every chunk except the last is exactly this size" }
        maxChunks: { type: integer }
        receivedChunks: { type: array, items: { type: integer } }
        operationId: { $ref: "#/components/schemas/Id" }
        snapshotId: { $ref: "#/components/schemas/Id" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    SourceSnapshot:
      type: object
      required: [id, projectId, digest, fileCount, totalBytes, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        digest: { $ref: "#/components/schemas/Digest" }
        fileCount: { type: integer }
        totalBytes: { type: integer, format: int64 }
        rejectedEntries: { type: integer, description: "Links, special files and traversal paths refused" }
        excludedEntries: { type: integer, description: Entries left out by default or requested exclusion rules }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        createdBy: { $ref: "#/components/schemas/Principal" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        deletedAt: { $ref: "#/components/schemas/Timestamp" }
    SourceSnapshotList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SourceSnapshot" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, maxLength: 64 }
        message: { type: string, maxLength: 1024 }
        path: { type: string, maxLength: 1024 }

    Discovery:
      type: object
      required: [id, snapshotId, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        snapshotId: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [running, completed, failed] }
        findings: { type: array, items: { $ref: "#/components/schemas/DetectorFinding" } }
        dockerfiles: { type: array, items: { $ref: "#/components/schemas/DockerfileAnalysis" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        sandbox:
          type: object
          description: Isolation the discovery process actually had
          required: [platform, seccomp, namespaces]
          properties:
            platform: { type: string }
            seccomp: { type: boolean, description: "Process creation and sockets denied" }
            namespaces: { type: boolean, description: "Separate user and network namespaces" }
        error: { $ref: "#/components/schemas/Problem" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    DiscoveryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Discovery" } }
    DetectorFinding:
      type: object
      required: [detectorId, detectorVersion, sourceSubpath, confidence, evidence]
      properties:
        detectorId: { type: string }
        detectorVersion: { type: string }
        sourceSubpath: { type: string }
        language: { type: string }
        framework: { type: string }
        applicationKind: { type: string, enum: [http-service, static-site, worker, cli-task, database, other] }
        runtimeConstraints: { type: object, additionalProperties: { type: string } }
        packageManager: { type: string }
        suggestedCommands: { type: object, additionalProperties: { type: string } }
        requiredPlatforms: { type: array, items: { type: string } }
        confidence: { type: string, enum: [high, medium, low] }
        evidence:
          type: array
          items:
            type: object
            required: [kind, path, observation, weight]
            properties:
              kind: { type: string }
              path: { type: string }
              pointer: { type: string }
              observation: { type: string }
              weight: { type: integer, minimum: -2, maximum: 3 }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        networkNeeds: { type: array, items: { $ref: "#/components/schemas/NetworkNeed" }, description: "Install-time downloads predicted from manifests, lockfiles and package scripts (ADR 0050)" }
        readiness: { type: array, items: { $ref: "#/components/schemas/ReadinessItem" }, description: "Predicted problems; for display the server adds those under the current egress policy" }
    NetworkNeed:
      type: object
      description: A destination a build step is predicted to reach, found statically (ADR 0050).
      required: [path, kind, cause, confidence, severity]
      properties:
        path: { type: string, description: The file the prediction comes from }
        line: { type: integer, minimum: 0 }
        kind: { type: string, enum: [package-manager, registry, downloader, url] }
        cause: { type: string, maxLength: 4096 }
        preset: { type: string, description: The egress preset that serves the need }
        destinations: { type: array, items: { type: string }, description: "host:port destinations when no preset serves the need" }
        confidence: { type: string, enum: [certain, likely, possible] }
        severity: { type: string, enum: [will-fail, may-fail], description: What happens to the build when the destination is unreachable }
        fixer: { type: string, enum: [developer, administrator] }
        fix: { type: string, maxLength: 4096 }
        devOnly: { type: boolean, description: Needed only when development dependencies are installed }
    ReadinessItem:
      type: object
      description: "A predicted build problem: how sure Samuori is, who can fix it and how (ADR 0050). Advice only; admission decides whether a build may run."
      required: [code, severity, fixer, confidence, message, fix]
      properties:
        code: { type: string, maxLength: 64 }
        severity: { type: string, enum: [will-fail, may-fail, advice] }
        fixer: { type: string, enum: [developer, administrator] }
        confidence: { type: string, enum: [certain, likely, possible] }
        message: { type: string, maxLength: 4096 }
        fix: { type: string, maxLength: 4096 }
        alternative: { type: string, maxLength: 4096 }
        path: { type: string }
        line: { type: integer, minimum: 0 }
        blocking: { type: boolean, description: "Repeats a reason admission already refuses the build for" }
        requestable:
          allOf: [{ $ref: "#/components/schemas/EgressEntries" }]
          description: "Egress a project member may request for this project only (POST /projects/{projectId}/egress-access-requests)"
    DockerfileAnalysis:
      type: object
      required: [path, stages, secretMounts]
      properties:
        path: { type: string }
        frontend: { type: string, description: "# syntax= value, if any" }
        frontendApproved: { type: boolean }
        stages: { type: array, items: { type: string } }
        baseImages: { type: array, items: { type: string } }
        args: { type: array, items: { type: string } }
        exposedPorts: { type: array, items: { type: string } }
        secretMounts:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { $ref: "#/components/schemas/LogicalSecretId" }
              target: { type: string }
              required: { type: boolean }
              envExposed: { type: boolean }
        ambiguities: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        refusedFeatures: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        networkNeeds: { type: array, items: { $ref: "#/components/schemas/NetworkNeed" }, description: "What RUN steps and the packages they install are predicted to reach (ADR 0050)" }
        readiness: { type: array, items: { $ref: "#/components/schemas/ReadinessItem" }, description: "Predicted problems; for display the server adds those under the current egress policy for Dockerfile builds" }

    BuildSpec:
      type: object
      required: [id, projectId, name, latestRevision]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        latestRevision: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    BuildSpecList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BuildSpec" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    BuildSpecDocument:
      type: object
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: true
      description: Validated server-side against api/schemas/buildspec.v1alpha1.json, which OpenAPI 3.0 cannot express fully.
      properties:
        apiVersion: { type: string, enum: [samuori.invalid/v1alpha1] }
        kind: { type: string, enum: [ImageBuild] }
        metadata: { type: object }
        spec: { type: object }
    SpecRevisionCreate:
      type: object
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/BuildSpecDocument" }
        editorMode: { type: string, enum: [guided, detailed, yaml] }
        note: { type: string, maxLength: 512 }
    SpecRevision:
      type: object
      required: [specId, revision, digest, document, createdAt]
      properties:
        specId: { $ref: "#/components/schemas/Id" }
        revision: { type: integer, minimum: 1 }
        digest: { $ref: "#/components/schemas/Digest" }
        document: { $ref: "#/components/schemas/BuildSpecDocument" }
        editorMode: { type: string, enum: [guided, detailed, yaml] }
        createdBy: { $ref: "#/components/schemas/Principal" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        warnings:
          type: array
          description: "Returned when a revision is saved: fixed default tags the project already published (ADR 0054); saving is never refused for them"
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    SpecRevisionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SpecRevision" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    AdmissionCheckRequest:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: "#/components/schemas/Id" }
    AdmissionReport:
      type: object
      required: [admissible, secretReadiness]
      properties:
        admissible: { type: boolean }
        schemaErrors: { type: array, items: { $ref: "#/components/schemas/ProblemDetail" } }
        semanticErrors: { type: array, items: { $ref: "#/components/schemas/ProblemDetail" } }
        policyDecisions: { type: array, items: { $ref: "#/components/schemas/PolicyDecision" } }
        secretReadiness: { type: array, items: { $ref: "#/components/schemas/SecretReadiness" } }
        platformIssues: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" }, description: "Advice that does not block admission" }
        secretBearing: { type: boolean }
        baseImagePins:
          type: array
          items: { $ref: "#/components/schemas/BaseImagePin" }
          description: "FROM tags resolved to digests for this check; a build resolves them again when it is admitted"
        readiness:
          type: array
          items: { $ref: "#/components/schemas/ReadinessItem" }
          description: "Build readiness: predicted problems, most severe first. Advice only; it never changes admissible (ADR 0050)"
      example:
        admissible: false
        secretBearing: true
        secretReadiness:
          - { id: sa_password, required: true, type: text, usage: build, mountTarget: /run/secrets/sa_password, status: ready }
          - { id: tde_key, required: true, type: binary, usage: build, mountTarget: /certificates/SQLServerTDECert.pvk, status: missing, reason: No binding exists for this project; request access from a project administrator }
    SecretReadiness:
      type: object
      required: [id, required, status]
      description: Developer view of a logical secret. Never includes values or provider references.
      properties:
        id: { $ref: "#/components/schemas/LogicalSecretId" }
        required: { type: boolean }
        type: { type: string, enum: [text, binary] }
        usage: { type: string, enum: [build, test] }
        mountTarget: { type: string }
        status: { type: string, enum: [ready, missing, unbound, not-permitted] }
        reason: { type: string, maxLength: 512 }
    BaseImagePin:
      type: object
      required: [ref, image]
      properties:
        ref: { type: string, description: "The FROM reference as written, such as node:18-alpine" }
        image: { type: string, description: "The image built in its place, repository@sha256:<digest>" }
    PolicyDecision:
      type: object
      required: [policyId, policyVersion, outcome]
      properties:
        policyId: { $ref: "#/components/schemas/Id" }
        policyVersion: { type: integer }
        outcome: { type: string, enum: [allow, warn, require-exception, block] }
        reason: { type: string, maxLength: 1024 }
        requestableRepositories:
          type: array
          items: { type: string }
          description: "Base-image repositories refused only because they are not on the approved list; a project member may request them (POST /projects/{projectId}/base-image-requests)"

    BuildRunState:
      type: string
      enum: [draft, pending_admission, queued, assigned, preparing, building, committing, succeeded, blocked, failed, timed_out, cancelled, expired, discarded]
    BuildRunCreate:
      type: object
      required: [specId, specRevision, snapshotId]
      properties:
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer, minimum: 1 }
        snapshotId: { $ref: "#/components/schemas/Id" }
        cleanBuild: { type: boolean, default: false }
        location: { type: string, description: Preferred location; it must be one the project may build in }
    BuildDeletion:
      type: object
      required: [deletedBy, deletedAt, reason]
      properties:
        deletedBy: { type: string }
        deletedAt: { $ref: "#/components/schemas/Timestamp" }
        reason: { type: string }
    BuildRun:
      type: object
      required: [id, projectId, specId, specRevision, snapshotId, state, createdAt]
      properties:
        deletion: { $ref: "#/components/schemas/BuildDeletion" }
        version: { type: string, description: "<UTC date it succeeded>.<n>, counted per project and day (ADR 0054)" }
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        specId: { $ref: "#/components/schemas/Id" }
        specRevision: { type: integer }
        snapshotId: { $ref: "#/components/schemas/Id" }
        snapshotDigest: { $ref: "#/components/schemas/Digest" }
        specDigest: { $ref: "#/components/schemas/Digest" }
        planDigest: { $ref: "#/components/schemas/Digest" }
        baseImagePins:
          type: array
          items: { $ref: "#/components/schemas/BaseImagePin" }
          description: "FROM tags the plan pinned to digests at admission (ADR 0049); returned by GET /builds/{buildId}"
        imageLabels:
          type: object
          additionalProperties: { type: string }
          description: "Labels the plan writes into the image config, spec values merged over automatic OCI values; returned by GET /builds/{buildId}"
        imageAnnotations:
          type: object
          additionalProperties: { type: string }
          description: "Annotations the plan writes onto the image manifests (and index for a multi-platform build); returned by GET /builds/{buildId}"
        state: { $ref: "#/components/schemas/BuildRunState" }
        failureClass: { type: string, enum: [application, infrastructure], nullable: true }
        blockedReason: { type: string, maxLength: 1024 }
        isolationProfile: { type: string, enum: [vm-per-job, rootless-dedicated-vm, rootless-host] }
        preferredLocation: { type: string }
        secretBearing: { type: boolean }
        currentAttemptId: { $ref: "#/components/schemas/Id" }
        artifactId: { $ref: "#/components/schemas/Id" }
        artifactDigest: { $ref: "#/components/schemas/Digest" }
        validation: { $ref: "#/components/schemas/ValidationSummary" }
        attemptsUsed: { type: integer }
        maxAttempts: { type: integer }
        requestedBy: { $ref: "#/components/schemas/Principal" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    BuildRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BuildRun" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    BuildAttempt:
      type: object
      required: [id, buildRunId, number, state]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        buildRunId: { $ref: "#/components/schemas/Id" }
        number: { type: integer, minimum: 1 }
        state: { type: string, enum: [leased, preparing, building, committing, completed, failed, abandoned, superseded] }
        workerId: { $ref: "#/components/schemas/Id" }
        poolId: { $ref: "#/components/schemas/Id" }
        location: { type: string }
        engineVersion: { type: string }
        isolationProfile: { type: string }
        freshDaemon: { type: boolean }
        failureClass: { type: string, enum: [application, infrastructure, timeout, resource-limit] }
        detail: { type: string, maxLength: 2048, description: Why the attempt failed; secret values are masked by the worker }
        cleanup:
          type: object
          properties:
            outcome: { type: string, enum: [pending, destroyed, failed-quarantined] }
            at: { $ref: "#/components/schemas/Timestamp" }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        endedAt: { $ref: "#/components/schemas/Timestamp" }
        egressDenied:
          type: array
          maxItems: 50
          description: >-
            Destinations the worker's egress proxy denied during this attempt, reported by the worker as structured
            data (never parsed from the build log), with advice computed from the current egress policy.
          items: { $ref: "#/components/schemas/EgressDenial" }
        egressUnrecorded:
          type: integer
          minimum: 0
          description: Proxy decisions beyond its per-attempt limit; further denials may be missing from egressDenied
    EgressDenial:
      type: object
      required: [host, port, count, reason, hint, presets, allowable]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        count: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 200 }
        hint: { type: string, description: "What an administrator can do, from the egress preset catalog and the current policy" }
        presets: { type: array, items: { type: string }, description: Egress presets that contain this exact host and port }
        allowable: { type: boolean, description: "False when the proxy refuses this destination on principle (loopback, link-local, metadata, multicast)" }
        requestable: { type: boolean, description: "A project member may request this destination for the project only (ADR 0052)" }
        network: { type: string, enum: [public, internal], description: "How it can be opened; internal for a private address or non-public name" }
    BuildAttemptList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BuildAttempt" } }

    ImageArtifact:
      type: object
      required: [id, digest, buildRunId, sensitivity]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        digest: { $ref: "#/components/schemas/Digest" }
        mediaType: { type: string }
        sizeBytes: { type: integer }
        platforms: { type: array, items: { type: string } }
        buildRunId: { $ref: "#/components/schemas/Id" }
        sensitivity: { type: string, enum: [normal, restricted] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        version: { type: string, description: "<UTC date>.<n>, counted per project and day (ADR 0054)" }
        defaultTags: { type: array, items: { type: string }, description: Tags a publication applies when the publisher gives none }

    DeploymentFiles:
      type: object
      required: [artifactId, reference, published, composeFilename, chartFilename, publications]
      properties:
        artifactId: { $ref: "#/components/schemas/Id" }
        reference: { type: string, description: "The image reference the files use: registry/repository:tag@digest when published, otherwise the docker load name" }
        published: { type: boolean, description: "False when the files name the local image, which must be downloaded and loaded first" }
        publicationId: { $ref: "#/components/schemas/Id" }
        composeFilename: { type: string }
        chartFilename: { type: string }
        publications:
          type: array
          description: "Successful, unretired publications of the image, newest first"
          items: { $ref: "#/components/schemas/DeploymentTarget" }

    DeploymentTarget:
      type: object
      required: [publicationId, reference, publishedAt]
      properties:
        publicationId: { $ref: "#/components/schemas/Id" }
        destinationName: { type: string }
        reference: { type: string }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }

    ValidationSummary:
      type: object
      required: [id, state]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        state: { type: string, enum: [pending, running, completed, cancelled, timed_out, errored] }
        verdict: { type: string, enum: [passed, failed, blocked, incomplete], nullable: true }
    ValidationRun:
      type: object
      required: [id, artifactId, artifactDigest, trigger, state, checks, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        artifactId: { $ref: "#/components/schemas/Id" }
        artifactDigest: { $ref: "#/components/schemas/Digest" }
        buildRunId: { $ref: "#/components/schemas/Id" }
        trigger: { type: string, enum: [build, rescan, promotion] }
        state: { type: string, enum: [pending, running, completed, cancelled, timed_out, errored] }
        verdict: { type: string, enum: [passed, failed, blocked, incomplete], nullable: true }
        classification: { type: string, enum: [standard, restricted], description: restricted when a finding passed only through an exception }
        reason: { type: string, maxLength: 1024 }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        finishedAt: { $ref: "#/components/schemas/Timestamp" }
    ValidationRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ValidationRun" } }
    CheckResult:
      type: object
      required: [checkId, category, required, outcome]
      properties:
        checkId: { type: string }
        category: { type: string, enum: [test, scan, sbom, provenance, signature, sensitive-content] }
        origin: { type: string, enum: [worker, controller], description: Worker checks run in the build environment }
        required: { type: boolean }
        outcome: { type: string, enum: [passed, failed, blocked, skipped, errored] }
        outputDigest: { $ref: "#/components/schemas/Digest" }
        reason: { type: string, maxLength: 1024 }
        tool:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
            database: { type: string, description: "The vulnerability database the scanner used: source, version and age" }
        sensitiveFindings: { type: array, items: { $ref: "#/components/schemas/SensitiveFinding" } }
        vulnerabilities:
          type: array
          items:
            type: object
            required: [id, severity, package, version, outcome]
            properties:
              id: { type: string }
              severity: { type: string }
              package: { type: string }
              version: { type: string }
              fixedVersion: { type: string }
              outcome: { type: string, enum: [fail, report, ignored] }
    SensitiveFinding:
      type: object
      required: [rule, path, outcome]
      description: Never includes file contents or secret values.
      properties:
        rule: { type: string }
        class: { type: string }
        path: { type: string }
        expectedReason: { type: string, description: The spec declares this output as expected; it still needs an exception when blocked }
        layerDigest: { $ref: "#/components/schemas/Digest" }
        sizeBytes: { type: integer }
        logicalSecretId: { $ref: "#/components/schemas/LogicalSecretId" }
        outcome: { type: string, enum: [warn, require-exception, excepted, block] }
        exceptionId: { $ref: "#/components/schemas/Id" }

    DestinationSummary:
      type: object
      required: [id, name, repository]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        repository: { type: string }
        acceptsRestricted: { type: boolean }
        requiresApproval: { type: boolean }
    DestinationSummaryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DestinationSummary" } }
    PublicationRequest:
      type: object
      required: [kind, destinationId]
      description: "publish needs artifactId; promote needs sourcePublicationId, a published publication of the image; rollback needs sourcePublicationId at destinationId and the tags to move back to it"
      properties:
        kind: { type: string, enum: [publish, promote, rollback] }
        artifactId: { $ref: "#/components/schemas/Id" }
        sourcePublicationId: { $ref: "#/components/schemas/Id" }
        destinationId: { $ref: "#/components/schemas/Id" }
        tags: { type: array, maxItems: 16, items: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$" } }
    Publication:
      type: object
      required: [id, kind, artifactId, destinationId, state, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [publish, promote, rollback] }
        artifactId: { $ref: "#/components/schemas/Id" }
        sourcePublicationId: { $ref: "#/components/schemas/Id" }
        destinationId: { $ref: "#/components/schemas/Id" }
        tags: { type: array, items: { type: string } }
        state: { type: string, enum: [requested, awaiting_approval, approved, gate_check, publishing, verifying, published, retired, rejected, expired, blocked, failed, cancelled] }
        reason: { type: string, maxLength: 1024 }
        gateDecisions: { type: array, items: { $ref: "#/components/schemas/GateDecision" } }
        destinationDigest: { $ref: "#/components/schemas/Digest" }
        destinationRef: { type: string, description: repository@digest at the destination }
        validationRunId: { $ref: "#/components/schemas/Id" }
        signatureRef: { type: string, description: The Cosign signature at the destination (repository@digest) }
        attestationRef: { type: string, description: The signed SLSA provenance attestation at the destination (repository@digest) }
        signatureStorage: { type: string, enum: [cosign-tag, oci-referrers+cosign-tag], description: "Where signatures were written: Cosign tags, plus OCI 1.1 referrers when the registry serves them (OD-25)" }
        approvalIds: { type: array, items: { $ref: "#/components/schemas/Id" } }
        deprecatedAt: { $ref: "#/components/schemas/Timestamp" }
        deprecationReason: { type: string, maxLength: 1024 }
        retiredAt: { $ref: "#/components/schemas/Timestamp" }
        retirementReason: { type: string, maxLength: 1024 }
        requestedBy: { $ref: "#/components/schemas/Principal" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    PublicationDeprecation:
      type: object
      required: [deprecated]
      properties:
        deprecated: { type: boolean }
        reason: { type: string, minLength: 10, maxLength: 1024, description: Required when deprecating }
    GateDecision:
      type: object
      required: [gate, outcome]
      properties:
        gate: { type: string, enum: [destination, kind, approval, promotion-source, source-signature, rollback-source, signing, credentials, validation, classification, worker-trust, artifact, tags] }
        outcome: { type: string, enum: [allow, deny] }
        reason: { type: string, maxLength: 1024 }
    PublicationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Publication" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    Approval:
      type: object
      required: [id, projectId, subjectType, subjectId, state, summary, requestedBy, canDecide, createdAt, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        subjectType: { type: string, enum: [publication, security-exception, secret-binding, repository-request, base-image-request, egress-access-request] }
        subjectId: { $ref: "#/components/schemas/Id" }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        summary: { type: string, maxLength: 4096 }
        requestedBy: { $ref: "#/components/schemas/Principal" }
        canDecide: { type: boolean, description: The caller may decide it; requesters never decide their own requests }
        decidedBy: { $ref: "#/components/schemas/Principal" }
        reason: { type: string, maxLength: 2048 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { type: string, format: date-time, description: When a pending request lapses }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        validUntil: { type: string, format: date-time, description: How long an approval may be acted on }
    ApprovalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    ApprovalDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 10, maxLength: 2048 }
        validUntil: { type: string, format: date-time, description: Optional end of the approval's validity }

    Worker:
      type: object
      required: [id, name, enrollmentState, operationalState, eligibility, selfTest]
      description: Enrollment never implies trust; see eligibility. poolId is absent while the worker is unassigned, and an unassigned worker receives no builds (ADR 0045).
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        poolId: { $ref: "#/components/schemas/Id" }
        enrollmentState: { type: string, enum: [enrolled, expired, revoked] }
        operationalState: { type: string, enum: [active, cordoned, draining, quarantined] }
        removal:
          type: object
          description: Present once an administrator removed the worker (ADR 0045)
          required: [state, reason, requestedAt]
          properties:
            state: { type: string, enum: [draining, wiping, removed] }
            outcome: { type: string, enum: [wiped, not-confirmed] }
            detail: { type: string }
            reason: { type: string }
            requestedAt: { $ref: "#/components/schemas/Timestamp" }
        eligibility:
          type: object
          required: [untrustedBuilds, reasons]
          properties:
            untrustedBuilds: { type: boolean }
            reasons:
              type: array
              items:
                type: string
                enum: [unassigned, profile-not-approved, worker-self-test-stale, worker-self-test-failed, worker-config-changed, egress-not-strict, cordoned, quarantined, revoked, version-incompatible, platform-unsupported, no-free-daemon-slot]
        selfTest:
          type: object
          required: [status, current]
          description: The worker's newest finished self-test; current is false when the profile or configuration changed since
          properties:
            status: { type: string, enum: [never-run, passed, failed] }
            running: { type: boolean }
            current: { type: boolean }
            finishedAt: { $ref: "#/components/schemas/Timestamp" }
            profile: { type: string }
            configDigest: { type: string }
            failedChecks: { type: array, items: { type: string } }
        capabilities:
          type: object
          properties:
            os: { type: string, enum: [linux, windows] }
            architectures: { type: array, items: { type: string } }
            engines: { type: array, items: { type: string } }
            isolationProfiles: { type: array, items: { type: string } }
            daemonSlots: { type: integer, minimum: 0, description: Free one-build daemons (OD-16) }
            configDigest: { type: string, description: Digest of the worker's security-relevant configuration }
        version: { type: string }
        certificateExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
        bundleVersion: { type: integer, format: int64, description: Trust-bundle version the worker acknowledged }
        revokedAt: { $ref: "#/components/schemas/Timestamp" }
        revokeReason: { type: string }
        compromisedSince: { $ref: "#/components/schemas/Timestamp" }
    WorkerList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Worker" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    WorkerAction:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [cordon, uncordon, drain, quarantine, revoke, remove], description: "remove drains the worker, has its host wipe Samuori, then revokes it (ADR 0045)" }
        reason: { type: string, minLength: 5, maxLength: 1024 }
        compromisedSince:
          type: string
          format: date-time
          description: Revoke only. Marks the worker compromised; images it built in attempts started since then are quarantined
    WorkerAssignment:
      type: object
      required: [poolId]
      properties:
        poolId: { $ref: "#/components/schemas/Id" }
        reason: { type: string, maxLength: 1024 }
    WorkerPoolUpdate:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
        location: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
        trustDomain: { type: string, minLength: 1, maxLength: 63 }
        isolationProfile: { type: string, enum: [vm-per-job, rootless-dedicated-vm, rootless-host] }
        trustedWorkloadsOnly: { type: boolean }
    Location:
      type: object
      required: [name, description, createdAt]
      properties:
        name: { type: string }
        description: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    LocationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
        description: { type: string, maxLength: 512 }
    LocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Location" } }
    ProjectLocations:
      type: object
      required: [locations]
      properties:
        locations: { type: array, maxItems: 64, items: { type: string } }
    CaRotation:
      type: object
      required: [mode, reason]
      properties:
        mode: { type: string, enum: [planned, emergency] }
        reason: { type: string, minLength: 10, maxLength: 1024 }
    TrustBundleStatus:
      type: object
      required: [bundleVersion, issuingPin, rotationInProgress, anchors, pendingWorkers]
      properties:
        bundleVersion: { type: integer, format: int64 }
        issuingPin: { type: string }
        rotationInProgress: { type: boolean }
        anchors:
          type: array
          items:
            type: object
            required: [pin, state, notBefore, notAfter]
            properties:
              pin: { type: string }
              state: { type: string, enum: [issuing, next, retiring] }
              notBefore: { $ref: "#/components/schemas/Timestamp" }
              notAfter: { $ref: "#/components/schemas/Timestamp" }
              retireAfter: { $ref: "#/components/schemas/Timestamp" }
        pendingWorkers:
          type: array
          description: Active workers that have not acknowledged the current bundle; they block a planned switch
          items:
            type: object
            required: [id, name, bundleVersion]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              name: { type: string }
              bundleVersion: { type: integer, format: int64 }
    ArtifactQuarantine:
      type: object
      required: [id, digest, workerId, reason, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        digest: { $ref: "#/components/schemas/Digest" }
        workerId: { $ref: "#/components/schemas/Id" }
        reason: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        releasedAt: { $ref: "#/components/schemas/Timestamp" }
        releasedBy: { type: string }
        releaseReason: { type: string }
    ArtifactQuarantineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ArtifactQuarantine" } }
    StorageStatus:
      type: object
      required: [backend, blobs, bytes, measuredAt]
      properties:
        backend: { type: string, enum: [local, s3, oci, mixed], description: "The backend every class uses, or mixed when classes are routed to different backends" }
        location: { type: string, description: "Where blobs are kept durably, without credentials, when every class uses one remote; the data directory is then a verified cache" }
        routes:
          type: array
          description: Where each data class is kept durably (D04)
          items:
            type: object
            required: [class, backend]
            properties:
              class: { type: string, enum: [source, image, report, other] }
              backend: { type: string, enum: [local, s3, oci] }
              location: { type: string }
        blobs: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        held: { type: integer, format: int64, description: Active holds }
        measuredAt: { $ref: "#/components/schemas/Timestamp" }
    BuildCacheList:
      type: object
      required: [items, ttlHours, maxScopeBytes]
      properties:
        ttlHours: { type: integer }
        maxScopeBytes: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            required: [scope, projectId, entries, bytes, newestAt]
            properties:
              scope: { type: string }
              projectId: { $ref: "#/components/schemas/Id" }
              projectName: { type: string }
              entries: { type: integer }
              bytes: { type: integer, format: int64 }
              newestAt: { $ref: "#/components/schemas/Timestamp" }
              lastUsedAt: { $ref: "#/components/schemas/Timestamp" }
    Backup:
      type: object
      required: [id, createdAt, file, size, sha256, dialect, schemaVersion, tables, rows, blobs, includesKeys, trigger, removed]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        file: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        dialect: { type: string, enum: [sqlite, postgres] }
        schemaVersion: { type: integer, format: int64 }
        tables: { type: integer }
        rows: { type: integer, format: int64 }
        blobs: { type: integer }
        includesKeys: { type: boolean }
        trigger: { type: string, enum: [manual, schedule, command, upgrade] }
        createdBy: { $ref: "#/components/schemas/Id" }
        checkedAt: { $ref: "#/components/schemas/Timestamp" }
        checkResult: { type: string, enum: [intact, changed, missing] }
        removed: { type: boolean, description: Pruned from the backup directory; the record stays }
    FederationIdentity:
      type: object
      required: [organizationId, caPin, listening]
      properties:
        organizationId: { $ref: "#/components/schemas/Id" }
        caPin: { type: string }
        listening: { type: boolean }
        hostnames: { type: array, items: { type: string } }
    FederationPeerWrite:
      type: object
      required: [name, endpoint, caPin, organizationId]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }
        endpoint: { type: string, maxLength: 512 }
        caPin: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        organizationId: { $ref: "#/components/schemas/Id" }
    FederationPeer:
      type: object
      required: [id, name, endpoint, caPin, organizationId, createdAt, disabled]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        endpoint: { type: string }
        caPin: { type: string }
        organizationId: { $ref: "#/components/schemas/Id" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        disabled: { type: boolean }
    FederationGrantWrite:
      type: object
      required: [peerId, projectId, locations, maxActive]
      properties:
        peerId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        locations: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 63 } }
        maxActive: { type: integer, minimum: 1, maximum: 1000 }
    FederationGrant:
      type: object
      required: [id, peerId, projectId, locations, maxActive, createdAt, revoked]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        peerId: { $ref: "#/components/schemas/Id" }
        projectId: { $ref: "#/components/schemas/Id" }
        locations: { type: array, items: { type: string } }
        maxActive: { type: integer }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        revoked: { type: boolean }
    FederationRouteWrite:
      type: object
      required: [peerId, location, remoteLocation]
      properties:
        peerId: { $ref: "#/components/schemas/Id" }
        location: { type: string, maxLength: 63 }
        remoteLocation: { type: string, maxLength: 63 }
    FederationRoute:
      type: object
      required: [id, peerId, location, remoteLocation, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        peerId: { $ref: "#/components/schemas/Id" }
        location: { type: string }
        remoteLocation: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    FederationDelegation:
      type: object
      required: [id, runId, peerId, remoteLocation, state, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        runId: { $ref: "#/components/schemas/Id" }
        peerId: { $ref: "#/components/schemas/Id" }
        remoteLocation: { type: string }
        state: { type: string, enum: [pending, accepted, completed, failed, cancelled, abandoned, withdrawn] }
        remoteRunId: { type: string }
        remoteState: { type: string }
        detail: { type: string }
        lastContactAt: { $ref: "#/components/schemas/Timestamp" }
        unreachableSince: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    FederationReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    DatabaseStatus:
      type: object
      required: [engine, serverVersion, latencyMs, pool, controllers, canUpdate]
      properties:
        engine: { type: string, enum: [postgresql, sqlite] }
        host: { type: string }
        port: { type: string }
        database: { type: string }
        user: { type: string }
        tls: { type: string, description: The DSN's sslmode }
        serverVersion: { type: string }
        latencyMs: { type: integer, format: int64, description: A query through this controller's pool }
        pool:
          type: object
          required: [open, inUse, idle, maxOpen]
          properties:
            open: { type: integer }
            inUse: { type: integer }
            idle: { type: integer }
            maxOpen: { type: integer }
        revision:
          type: object
          description: The newest password handed to the controllers; absent while every controller uses the configured one
          required: [number, createdBy, createdAt, reason]
          properties:
            number: { type: integer, format: int64 }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            reason: { type: string }
        controllers:
          type: array
          items:
            type: object
            required: [id, hostname, status]
            properties:
              id: { type: string }
              hostname: { type: string }
              status: { type: string, enum: [verified, failed, pending] }
              detail: { type: string }
              checkedAt: { type: string, format: date-time }
        canUpdate: { type: boolean, description: "False for SQLite, which has no password" }
    DatabaseTestResult:
      type: object
      required: [serverVersion, latencyMs]
      properties:
        user: { type: string }
        serverVersion: { type: string }
        latencyMs: { type: integer, format: int64 }
    DatabasePasswordUpdate:
      type: object
      additionalProperties: false
      required: [password, reason]
      properties:
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }
        reason: { type: string, minLength: 3, maxLength: 1024 }
    Release:
      type: object
      required: [version, architectures, size, bundled, uploadedBy, uploadedAt]
      properties:
        version: { type: string }
        architectures: { type: array, items: { type: string } }
        size: { type: integer, format: int64 }
        workerProtocol: { type: string, description: "major.minor from the bundle manifest" }
        bundled: { type: boolean, description: "False for releases uploaded as separate files before bundles; they cannot be rolled out" }
        changes:
          type: array
          description: "The commit history the release was built from, newest first, from the signed manifest"
          items:
            type: object
            required: [commit, date, summary]
            properties:
              commit: { type: string }
              date: { type: string, description: "Commit date, YYYY-MM-DD" }
              summary: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
    ReleaseList:
      type: object
      required: [signersConfigured, items]
      properties:
        signersConfigured: { type: boolean, description: "Whether this controller has release signers; without them nothing can be uploaded" }
        items: { type: array, items: { $ref: "#/components/schemas/Release" } }
    Preflight:
      type: object
      required: [version, ready, checks, steps]
      properties:
        version: { type: string }
        ready: { type: boolean, description: "No check failed; warnings do not block" }
        checks:
          type: array
          items:
            type: object
            required: [id, name, state, detail]
            properties:
              id: { type: string }
              name: { type: string }
              state: { type: string, enum: [passed, warning, failed] }
              detail: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/RolloutStep" } }
    RolloutRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, pattern: "^[A-Za-z0-9.+_-]{1,64}$" }
        reason: { type: string, maxLength: 1024, description: "Optional note kept in the audit log" }
        pauseAfterFirstWave: { type: boolean, description: "Pause after the first wave of workers so an administrator can check it, then resume" }
        wavePercent: { type: integer, minimum: 1, maximum: 100, description: "Share of each pool updated at once; default 25, at least one worker. 100 updates one random secondary controller first, hands it the leadership, then every other controller and worker at once" }
        allowDowngrade: { type: boolean, description: "Allow a release older than a host's" }
    RolloutStep:
      type: object
      required: [seq, kind, name, state, wave, updatedAt]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [controller, worker] }
        name: { type: string }
        state: { type: string, enum: [pending, draining, requested, applying, testing, rolling_back, succeeded, failed, skipped] }
        detail: { type: string }
        wave: { type: integer }
        pool: { type: string }
        location: { type: string }
        arch: { type: string }
        updatedAt: { type: string, format: date-time }
    Rollout:
      type: object
      required: [id, version, state, reason, createdBy, createdAt, paused, wavePercent, steps]
      properties:
        id: { type: string }
        version: { type: string }
        state: { type: string, enum: [running, succeeded, failed, cancelled] }
        reason: { type: string }
        detail: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        paused: { type: boolean, description: "Running, but starting no further hosts until resumed" }
        pauseReason: { type: string }
        wavePercent: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/RolloutStep" } }
    RolloutList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Rollout" } }
    UpgradeStatus:
      type: object
      required: [version, schemaApplied, schemaKnown, controllers, workers, history]
      properties:
        version: { type: string, description: This controller's release }
        schemaApplied: { type: integer, format: int64 }
        schemaKnown: { type: integer, format: int64, description: Newest schema this release knows }
        controllers:
          type: array
          items:
            type: object
            required: [id, hostname, version, startedAt, heartbeatAt, live, leader, compatible]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              hostname: { type: string }
              host: { type: string, description: "The DNS name in the controller's certificates, when it has one" }
              version: { type: string }
              startedAt: { $ref: "#/components/schemas/Timestamp" }
              heartbeatAt: { $ref: "#/components/schemas/Timestamp" }
              live: { type: boolean }
              leader: { type: boolean }
              self: { type: boolean }
              compatible: { type: boolean, description: May share the database with this controller during a rolling upgrade }
        removals:
          type: array
          description: Controller removals of the last 30 days, newest first
          items: { $ref: "#/components/schemas/ControllerRemoval" }
        workers:
          type: array
          items:
            type: object
            required: [version, count, compatible]
            properties:
              version: { type: string }
              count: { type: integer }
              compatible: { type: boolean }
              reason: { type: string }
        history:
          type: array
          items:
            type: object
            required: [at, reason]
            properties:
              at: { $ref: "#/components/schemas/Timestamp" }
              reason: { type: string }
    ControllerRemoval:
      type: object
      required: [hostname, state, reason, requestedBy, requestedAt, updatedAt]
      properties:
        hostname: { type: string }
        host: { type: string, description: The name in the controller's certificates and its NATS member's server name }
        state: { type: string, enum: [requested, wiping, removed], description: "requested: handing over leadership and waiting for the host; wiping: the host started removing Samuori" }
        outcome: { type: string, enum: [wiped, not-confirmed], description: "Set once removed. not-confirmed: the host did not confirm the wipe" }
        detail: { type: string }
        reason: { type: string }
        requestedBy: { type: string }
        requestedAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ControllerJoinTokenRequest:
      type: object
      required: [ttlSeconds]
      properties:
        ttlSeconds: { type: integer, minimum: 300, maximum: 3600 }
    ControllerJoinToken:
      type: object
      required: [id, createdBy, createdAt, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        createdBy: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        usedAt: { $ref: "#/components/schemas/Timestamp" }
        usedHost: { type: string }
        revokedAt: { $ref: "#/components/schemas/Timestamp" }
    ControllerJoinTokenList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ControllerJoinToken" } }
    ControllerJoinTokenIssued:
      type: object
      required: [id, expiresAt, token, pin, url, code]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        token: { type: string, x-samuori-reveal-once: true, description: Single use; shown once }
        pin: { type: string, description: "SHA-256 pin of this controller's TLS certificate, which the joining controller checks" }
        url: { type: string, description: This controller's address for the joining controller }
        code: { type: string, x-samuori-reveal-once: true, description: "The URL, pin and token in one value (samuoric_...) for `cluster join --code`; shown once" }
    ControllerJoinRequest:
      type: object
      required: [id, tokenId, host, remoteAddress, verificationCode, state, createdAt, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        tokenId: { $ref: "#/components/schemas/Id" }
        host: { type: string }
        remoteAddress: { type: string }
        verificationCode: { type: string, description: Shown on the joining host; compare before accepting }
        state: { type: string, enum: [pending, accepted, rejected, completed, expired] }
        decidedBy: { type: string }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        reason: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    ControllerJoinRequestList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ControllerJoinRequest" } }
    ControllerJoinDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, reject] }
        reason: { type: string, maxLength: 500 }
    ClusterJoinRequest:
      type: object
      required: [token, host, secretHash]
      properties:
        token: { type: string, maxLength: 128, writeOnly: true }
