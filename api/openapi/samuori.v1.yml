openapi: 3.0.3
info:
  title: Samuori API
  version: 0.1.0-m0
  description: |
    M0 skeleton. Design: docs/architecture/api.md. Worker execution protocol is not part of this API (ADR 0024).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: system
  - name: identity
  - name: tenancy
  - name: sources
  - name: discovery
  - name: specs
  - name: builds
  - name: artifacts
  - name: validation
  - name: publication
  - name: approvals
  - name: workers
  - name: secrets
  - name: registries
  - name: policies
  - name: audit
  - name: notifications
  - name: pipelines
  - name: kubernetes

paths:
  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      x-samuori-public: true
      responses:
        "200":
          description: Liveness and component health from real checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /system/storage:
    get:
      tags: [system]
      operationId: getStorageStatus
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Internal artifact storage usage, measured now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }

  /system/storage/collections:
    post:
      tags: [system]
      operationId: collectGarbage
      description: Runs artifact garbage collection now; held and referenced content is never removed.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarbageCollection" }

  /build-caches:
    get:
      tags: [system]
      operationId: listBuildCaches
      description: "Shared build caches by scope (project, trust domain, binding and policy versions). Secret-bearing and clean builds use none."
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Cache scopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildCacheList" }

  /build-caches/{scope}/purge:
    parameters: [{ name: scope, in: path, required: true, schema: { type: string, pattern: "^cs-[a-f0-9]{32}$" } }]
    post:
      tags: [system]
      operationId: purgeBuildCache
      description: Removes every cache of the scope; the next build of the scope runs without cache. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Purged }
        "404": { $ref: "#/components/responses/Problem" }

  /system/backups:
    get:
      tags: [system]
      operationId: listBackups
      description: Encrypted backups written by this installation, newest first, and whether backups are configured.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Backups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
    post:
      tags: [system]
      operationId: createBackup
      description: Writes an encrypted backup now into the configured backup directory. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "201":
          description: Backup written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /system/backups/{backupId}/check:
    parameters: [{ name: backupId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: checkBackup
      description: Re-reads the archive and compares it with the digest recorded when it was written. Full verification needs the age identity (samuori-server verify-backup). Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "404": { $ref: "#/components/responses/Problem" }

  /federation/identity:
    get:
      tags: [system]
      operationId: getFederationIdentity
      description: What a peer administrator needs to register this installation, and whether the federation listener runs.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Federation identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationIdentity" }

  /federation/peers:
    get:
      tags: [system]
      operationId: listFederationPeers
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Peers
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FederationPeer" } } } }
    post:
      tags: [system]
      operationId: createFederationPeer
      description: Registers another installation by its endpoint, CA pin and organization. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerWrite" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /federation/peers/{peerId}/disable:
    parameters: [{ name: peerId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: disableFederationPeer
      description: Stops federation with the peer in both directions at once. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationReason" }
      responses:
        "204": { description: Disabled }
        "404": { $ref: "#/components/responses/Problem" }

  /federation/grants:
    get:
      tags: [system]
      operationId: listFederationGrants
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FederationGrant" } } } }
    post:
      tags: [system]
      operationId: createFederationGrant
      description: Lets a peer run builds in a hosting project, in locations of this installation's own workers. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationGrantWrite" }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationGrant" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /federation/grants/{grantId}/revoke:
    parameters: [{ name: grantId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: revokeFederationGrant
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationReason" }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }

  /federation/routes:
    get:
      tags: [system]
      operationId: listFederationRoutes
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FederationRoute" } } } }
    post:
      tags: [system]
      operationId: createFederationRoute
      description: Adds a location whose builds run at a peer location. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationRouteWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationRoute" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /federation/delegations:
    get:
      tags: [system]
      operationId: listFederationDelegations
      description: Builds this installation handed to peers, newest first.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Delegations
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/FederationDelegation" } } } }

  /federation/delegations/{delegationId}/abandon:
    parameters: [{ name: delegationId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: abandonFederationDelegation
      description: Fails the build here at once; the peer is told to stop when reachable and any later result is refused. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationReason" }
      responses:
        "204": { description: Abandoned }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /providers:
    get:
      tags: [system]
      operationId: listProviders
      description: Optional build and conversion providers Samuori can run, the administrator's approval of each, the workers that have the approved version, and the build method policy (ADR 0047, 0048).
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Providers and policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }

  /providers/{providerName}:
    parameters: [{ name: providerName, in: path, required: true, schema: { type: string, enum: [railpack, buildpacks, kompose, move2kube] } }]
    put:
      tags: [system]
      operationId: configureProvider
      description: Enables or disables a provider and pins its version and artifacts. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfig" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        "422": { $ref: "#/components/responses/Problem" }

  /build-method-policy:
    put:
      tags: [system]
      operationId: setBuildMethodPolicy
      description: Sets the allowed build methods and the default; an empty default means Samuori recommends one from discovery. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildMethodPolicy" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/topology:
    get:
      tags: [system]
      operationId: getTopology
      description: The target plan, the tier it would reach, and the tier measured now from live controllers, online self-tested workers, the database, storage and the portal URL (ADR 0046).
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Plan and assessments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyStatus" }
    put:
      tags: [system]
      operationId: setTopologyPlan
      description: Replaces the target plan and the declared database and storage replication. Audited. Changes no server; add or remove servers under Servers.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyPlan" }
      responses:
        "200":
          description: Stored; the new plan and assessments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyStatus" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/upgrades:
    get:
      tags: [system]
      operationId: getUpgradeStatus
      description: This release, the schema, the controllers sharing the database and the worker versions against the version matrix, with recent upgrades.
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Upgrade and version state, measured now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeStatus" }

  /system/capacity:
    get:
      tags: [system]
      operationId: getCapacity
      description: Disk, memory and CPUs each controller and worker last reported, the organization's unfinished builds and its open uploads, in one view.
      x-samuori-roles: [administrator, operator]
      responses:
        "200":
          description: Capacity and activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapacityOverview" }

  /system/cluster/controllers/{hostname}/remove:
    parameters: [{ name: hostname, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 253 } }]
    post:
      tags: [system]
      operationId: removeController
      description: Removes a controller host (ADR 0045). Leadership moves to another controller first, the host wipes Samuori, then its identity is revoked, its membership deleted and the remaining NATS members forget it. Refused for the last controller, while another controller is not running, when the remaining NATS members would not be a majority, and while an update rollout runs. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "202":
          description: Removal started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerRemoval" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /system/cluster/join-tokens:
    get:
      tags: [system]
      operationId: listControllerJoinTokens
      description: Recent controller join tokens, without their values.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Join tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerJoinTokenList" }
    post:
      tags: [system]
      operationId: createControllerJoinToken
      description: Issues a single-use token that lets one more controller join this cluster. Audited; the value is shown once.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControllerJoinTokenRequest" }
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerJoinTokenIssued" }
        "409": { $ref: "#/components/responses/Problem" }

  /system/cluster/join-tokens/{tokenId}:
    parameters: [{ name: tokenId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    delete:
      tags: [system]
      operationId: revokeControllerJoinToken
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Revoked and audited }
        "404": { $ref: "#/components/responses/Problem" }

  /system/cluster/join-requests:
    get:
      tags: [system]
      operationId: listControllerJoinRequests
      description: Recent controller join requests with their verification codes. Pending ones wait for an administrator.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Join requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerJoinRequestList" }

  /system/cluster/join-requests/{requestId}/decision:
    parameters: [{ name: requestId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: decideControllerJoinRequest
      description: Accepts or rejects a pending join request. Accepting lets that host collect its configuration and keys once. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControllerJoinDecision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerJoinRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /cluster/join:
    post:
      tags: [system]
      operationId: joinCluster
      description: Redeems a controller join token and opens a join request that an administrator must accept. Returns no secrets. Called by `samuori-server cluster join` over TLS pinned to this controller; never by browsers.
      security: []
      x-samuori-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterJoinRequest" }
      responses:
        "202":
          description: The join request waits for an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterJoinPending" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /cluster/join/requests/{requestId}/poll:
    parameters: [{ name: requestId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    post:
      tags: [system]
      operationId: pollClusterJoin
      description: The joining host checks its request with the secret whose hash it sent. Once accepted, the response holds the join bundle, sent once. A wrong secret is refused like an unknown request.
      security: []
      x-samuori-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterJoinPoll" }
      responses:
        "200":
          description: Still pending, or accepted with the join bundle, which holds secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterJoinPollResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /system/database:
    get:
      tags: [system]
      operationId: getDatabaseStatus
      description: Where the metadata database is, how this controller reaches it, and each live controller's check of the newest password. Never returns a password.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Database connection, measured now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseStatus" }

  /system/database/test:
    post:
      tags: [system]
      operationId: testDatabaseConnection
      description: Signs in to the database with a new connection from the controller handling the request.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: The sign-in worked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseTestResult" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/database/password:
    post:
      tags: [system]
      operationId: updateDatabasePassword
      description: >-
        Hands every controller the PostgreSQL password an administrator already set at the database. Samuori never
        changes the password itself. This controller verifies it with a new connection before storing it; every other
        controller verifies it again before switching. Audited with the reason; the password is never logged or returned.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabasePasswordUpdate" }
      responses:
        "200":
          description: Verified and stored; other controllers switch within seconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseStatus" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/releases:
    get:
      tags: [system]
      operationId: listReleases
      description: Signed releases uploaded for self-update, and whether this controller can verify releases at all.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }
    post:
      tags: [system]
      operationId: uploadRelease
      description: >-
        Uploads one update bundle (samuori-<version>.samuoriupdate from make update) holding every architecture. Its structure,
        checksums and signature against this controller's release signers are verified before anything is kept. Every
        host verifies its archive again before installing (ADRs 0044, 0045). Audited.
      x-samuori-roles: [administrator]
      x-samuori-max-body-bytes: 2147483648
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle: { type: string, format: binary }
      responses:
        "201":
          description: Verified and kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/releases/{version}:
    parameters: [{ name: version, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9.+_-]{1,64}$" } }]
    delete:
      tags: [system]
      operationId: deleteRelease
      description: Removes every architecture of a release no running rollout uses. Audited.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /system/releases/{version}/preflight:
    parameters: [{ name: version, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9.+_-]{1,64}$" } }]
    get:
      tags: [system]
      operationId: preflightRelease
      description: >-
        Runs the checks before updating to a release: signature, version path, worker protocol, every host reachable,
        free disk space and architectures, and shows the planned waves. Starting a rollout runs them again.
      x-samuori-roles: [administrator]
      parameters:
        - { name: allowDowngrade, in: query, required: false, schema: { type: boolean } }
        - { name: wavePercent, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: The checks and the plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preflight" }
        "404": { $ref: "#/components/responses/Problem" }

  /system/rollouts:
    get:
      tags: [system]
      operationId: listRollouts
      description: Rollouts, newest first, with each host's step. An empty list when there are none.
      x-samuori-roles: [administrator]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Rollouts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutList" }
    post:
      tags: [system]
      operationId: startRollout
      description: >-
        Runs the checks before updating and, if none fails, updates every controller one at a time with the leader last,
        then the workers of each pool in waves (pools in parallel), each drained, updated and self-tested. A failed host
        goes back to its previous release and pauses the rollout. Audited with the reason.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloutRequest" }
      responses:
        "201":
          description: Planned; the leader starts it within seconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollout" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [system]
      operationId: purgeRollouts
      description: Deletes every finished rollout and its steps; a running rollout stays. Audited with the count.
      x-samuori-roles: [administrator]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, description: Finished rollouts deleted }

  /system/rollouts/{rolloutId}:
    parameters: [{ name: rolloutId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }]
    get:
      tags: [system]
      operationId: getRollout
      description: One rollout and each host's step.
      x-samuori-roles: [administrator]
      responses:
        "200":
          description: The rollout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollout" }
        "404": { $ref: "#/components/responses/Problem" }

  /system/rollouts/{rolloutId}/pause:
