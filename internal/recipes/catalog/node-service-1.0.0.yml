id: node-service
version: 1.0.0
displayName: "Node.js application"
description: "Installs dependencies with your package manager, runs your build script if any, and starts the app as an unprivileged user."
languages: [javascript, typescript, nodejs]
applicationTypes: [http-service, worker, cli-task]
egressPresets: [npm]
platforms: [linux/amd64, linux/arm64]
runtimes:
  - version: "22"
    buildImage: docker.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    runImage: docker.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  - version: "24"
    buildImage: docker.io/library/node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    runImage: docker.io/library/node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
defaults:
  install: "npm ci"
stages:
  - name: build
    runtime: build
    steps:
      - workdir: /app
      - copySource: {from: ., to: .}
      - run: {command: install, network: egress}
      - run: {command: build}
  - runtime: run
    steps:
      - workdir: /app
      - copyFromStage: {stage: build, from: /app, to: /app, owner: "10001:10001"}
      - env: {name: NODE_ENV, value: production}
      - user: "10001"
      - exposeAppPort: true
      - start: true
