id: dotnet-service
version: 1.0.0
displayName: ".NET application"
description: "Restores and publishes with the .NET SDK, then runs the published output on the matching ASP.NET Core or .NET runtime image."
languages: [csharp, fsharp, visualbasic, dotnet]
applicationTypes: [http-service, worker, cli-task]
egressPresets: [nuget]
platforms: [linux/amd64, linux/arm64]
runtimes:
  - version: "8.0"
    buildImage: mcr.microsoft.com/dotnet/sdk:8.0@sha256:f7e28a0a3f6f9235929ec19274fd0ddf8534e9159f99fac602ac73304f1ce99f
    distro: debian
    runImage: mcr.microsoft.com/dotnet/aspnet:8.0@sha256:1601380775673021a23ea5985669f1daf03719faaa684f839da1752fb48cfc7f
    runImages:
      cli-task: mcr.microsoft.com/dotnet/runtime:8.0@sha256:60d11c2be381e7f90b8bd984472dd2432933858aba55087d5936980cf2071d5a
      worker: mcr.microsoft.com/dotnet/runtime:8.0@sha256:60d11c2be381e7f90b8bd984472dd2432933858aba55087d5936980cf2071d5a
  - version: "9.0"
    buildImage: mcr.microsoft.com/dotnet/sdk:9.0@sha256:2f5eb32870b4c0074a3d5b5191a03553bcab7b74463a76a7c0a5f3ef65c90fe5
    distro: debian
    runImage: mcr.microsoft.com/dotnet/aspnet:9.0@sha256:4d94cf3204df98d321e8dbf8d6d06e0b34fd136aa75c945abf4390ee07eb30dd
    runImages:
      cli-task: mcr.microsoft.com/dotnet/runtime:9.0@sha256:f0498f092ee240bb91f802b157054dc42c98d6fd6a853ba17e76965c555a9262
      worker: mcr.microsoft.com/dotnet/runtime:9.0@sha256:f0498f092ee240bb91f802b157054dc42c98d6fd6a853ba17e76965c555a9262
stages:
  - name: build
    runtime: build
    steps:
      - workdir: /src
      - copySource: {from: ., to: .}
      - run: {command: install, network: egress}
      - run: {command: build}
  - runtime: run
    steps:
      - workdir: /app
      - copyFromStage: {stage: build, from: /src/out, to: /app, owner: "10001:10001"}
      - user: "10001"
      - exposeAppPort: true
      - start: true
