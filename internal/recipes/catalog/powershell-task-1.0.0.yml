id: powershell-task
version: 1.0.0
displayName: "PowerShell script (Linux)"
description: "Runs PowerShell 7 scripts on Linux. Scripts that need Windows-only commands or modules will not work."
languages: [powershell]
applicationTypes: [cli-task, worker, http-service]
egressPresets: [powershell-gallery]
platforms: [linux/amd64]
runtimes:
  - version: "7.5"
    buildImage: mcr.microsoft.com/powershell:7.5-ubuntu-24.04@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81
    runImage: mcr.microsoft.com/powershell:7.5-ubuntu-24.04@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81
stages:
  - name: build
    runtime: build
    steps:
      - workdir: /app
      - copySource: {from: ., to: .}
      - run: {command: install, network: egress}
  - runtime: run
    steps:
      - workdir: /app
      - copyFromStage: {stage: build, from: /app, to: /app, owner: "10001:10001"}
      - user: "10001"
      - exposeAppPort: true
      - start: true
